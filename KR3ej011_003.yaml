body:
  text: 卷三闢諸驚名之謬夏禹鑄曰小兒發驚而村婦庸夫多以鐵針於兒手挑筋破肉噫異矣此喪心之村婦覓食之庸夫不知驚之為驚而誤認為筋骨之筋也蓋驚者驚嚇也由兒先有內傷復來外感肺竅痰迷心無所主一著驚而即發也若不豁痰以療驚祛風以止掣只把手筋挑斷以免筋抽不猶之止兒之啼而惟塞其口耶況驚屬心筋屬肝若挑筋以治驚便與明紀上有云女婿牙疼灸岳母的腳後跟又何有異推前人所稱蛇絲馬蹄鯽魚烏鴉等驚名之意無非為後之癡人立其名色告以病表使易識耳因兒舌吐出如蛇舌遂以蛇絲驚名兒手足撐踢如馬蹄遂以馬蹄驚名兒口動如魚吮水遂以鯽魚驚名兒身黑如烏鴉遂以烏鴉驚名如執此以治驚則當用雄黃以治蛇絲絆馬繩以治馬蹄香餌以治鯽魚穿楊箭以治烏鴉方為中病之藥然筋亦有時而抽者何蓋筋屬於肝血行於筋氣以行血肝有賊邪則氣血與賊邪交戰而不行以致筋受風邪而抽掣耳故豁痰以療驚祛風以止掣乃莫破之理餘妙法備傳較之玉宮紫府之仙方枯木回春之造化不相軒輊凡我同人萬不可以蛇絲諸詭名執為正論垂之以殺有冤莫訴之嬰兒也闡明發驚之由兼詳治驚之法夏禹鑄曰驚生於心痰生於脾風生於肝熱出於肺此一定之理也熱盛生風風盛生痰痰盛生驚此賊邪逆克必至之勢療驚必先豁痰豁痰必先祛風祛風必先解熱而解熱又以何者為先乎肺主皮毛皮毛為賊邪入內之門戶彼風寒暑濕燥火六邪之來皮毛受之即入犯乎肺肺本出熱地也燥火暑邪一入則熱與熱依而熱盛風寒濕邪一入肺竅為之閉塞則熱無所泄而熱亦盛若解熱必先祛邪前書上只云解熱並未說到祛邪今以祛邪之法詳之一用拿一用推一用燈火一用灸一用藥驚癇死症辨先君初明有曰如兒體不近肥痰不甚盛不省人事張目視人者在精威二穴對拿緊了不知痛竟無掙聲模樣惟咬齒搖頭此肺經已絕肺金也如鐘磬之類空則聲亮碎則聲無治之無益夏禹鑄曰驚之為症症屬有餘語云寧醫有餘不醫不足既曰有餘胡亦有死我知之矣此乃肺氣先弱肺主皮毛淫邪一犯肺實受之是已弱又加弱也由肺犯肝由肝犯脾理應犯腎奈腎只虛位卻無實地亦且水鄉風則可動而熱與燥火俱不得下其勢又難中阻只得又順傳入肺嗟嗟肺氣幾何而能堪此重困耶到此地位須得聚窟中返魂樹西域內更生香庶乎可活驚癇活症辨初明曰如驚痰築甚盛昏昏不省人事於不抽掣時把精威二穴對拿緊不咬齒不搖頭不直視人亦無掙聲的模樣將兒面向我以我兩手騎兒肩大指握前以第二兩指並狠狠揉肺俞兩穴聲雖不出一掙一掙恰似那蜾裸在窠中喚化螟蛉卻不是開口叫類我類我有聲有音的樣子卻是個緊閉著口掙不出累累如貫珠有聲無音的樣子此乃肺被痰築如鐘磬中以物塞之即重叩亦不響定是活症急灸肺俞穴各三壯只用天保采薇湯不必用推若發驚拿醒便知人事即用後推法並燈火及藥推法開天門二十四下從眉心推上髮際分陰陽九下用兩大指從眉心分推至太陽太陰此不論寒熱虛實皆用如感寒在太陽上重揉發汗體弱感寒亦揉太陽發汗並揉太陰以留汗使發汗在皮裡膜外之間庶免汗失亡陽更加虛弱之弊女則揉太陰發汗揉太陽止汗隨向天庭眉心山根準頭人中承漿各掐一下以代針法男在左手三關推上三十回六腑五六下以應之又將我兩手握兒左右掌向上於總筋穴分推六七下又在左手掌上運八卦從艮宮推往坎宮二三十回曲兒左手小指重揉外勞宮名曰黃蜂入洞三十下即於五指節逐一捻揉兩次在左腳委中穴往下捋三十下以上男女各推左手左腳即用元宵火定之隨服天保采薇湯邪即解驚即退而燒熱即除矣此祛邪之法也如症重燒極再加一劑從未有不效者燒熱退定在五更鼓以上法不論肺熱肺寒肝旺肝熱脾濕並用辨驚有痰盛風盛熱盛初明曰痰盛發驚一驚即死不省人事抽掣輕而燒熱盛此脾痰入肺亦用天保采薇湯內半夏倍加三四錢前胡倍加二錢蒼朮倍加一錢夏月加香薷初明曰風盛發驚雖驚死而精威兩穴一拿即蘇若手足抽掣不已一日一夜竟發數十次此肝風入筋亦用天保采薇湯內羌活柴胡各倍加一錢半夏倍加三錢如在夏月外加香薷一錢五分初明曰熱盛發驚其狀無異風痰只口多作渴此外邪入肺亦用天保采薇湯內乾葛桔梗倍加二錢除以上三症外有心經發驚之症舌必吐出其色紅燥此本臟有熱而發推法開天門分陰陽男在左手退下六腑女推上三關男女俱在左掌心運八卦推坎入艮掌中水底撈月引水上天河再用連翹二錢黃連五分木通防風各一錢水煎服如在夏月加香薷初明曰驚症或驚死一二日或三四五六七日不蘇即蘇亦不省人事或抽掣或不抽掣宜急於肺俞穴用艾灸三燋若一拿即蘇不必用灸只須元宵火天保采薇湯連服三四劑重加半夏四五錢從未有不活者如在夏月外加香薷一錢五分初明曰間亦有肺無痰塞拿之無聲者不搖頭張目亦是活症此由病久亂醫亂推亂拿無所不至哭喪肺氣以至無聲如此便知失聲之由切不可再推再拿用火用灸惟用天保采薇湯等分服之一劑便愈如在夏月外加香薷二錢初明曰又間有發驚昏昏沉沉條條直直而睡者雖不省人事亦能自己翻身手腳曲直自如竟至十日內外不醒卻又不死此症卻與柔痓相似不必推惟用拿拿精威大敦中臁肩井諸穴並揉五指節及肺俞穴以上諸穴各用燈火一燋用密陀僧一字系二釐半研細醋製用半杯水酒灌下再服天保采薇湯倍加桔梗半夏即蘇如在夏月外加香薷二錢夏禹鑄曰以上驚症先君只說形狀不言色竅蓋因驚死之際面目唇舌俱非本色如雲望色必清濁難分求其治法必亂絲無緒北適南轅在所不免只得把形狀辨別方無有誤辨熱瘧似驚風傷寒夏禹鑄曰熱瘧之燒熱與傷寒無異最難辨別看時若無真傳慧眼以熱瘧作傷寒驚風治者十有其十即問之普天下醫家能辨此症者吾知其必無多也余考先君效案中醫愈不下數千人看法載之甚悉治法亦覺平常然治之必效古所謂藥用當而通神者此也余遵先君辨法一見便知自信不啻雙鏡照膽一藥便愈無不駭曰奇症奇醫然而無奇也人惟辨之不真以故藥之不效今發辨瘧之秘傳我同人俾嬰兒不苦於熱瘧庶可告無罪於盧醫傷寒燒熱每日到晚不減一分不增一分始終毫不間斷只是平平而燒不抽不驚此乃傷寒之燒熱也驚風燒熱似乎傷寒而多一抽掣蓋由筋屬於肝肝風動故抽筋肝風入脾脾動痰故驚此乃驚風燒熱之辨也熱瘧燒熱雖同而症實有別或食滾茶滾湯或大哭大叫頭面上必有汗一有汗燒熱即退二三分少頃又照原便是熱瘧此一辨也自早至晚必有一時更甚或眼泛去或手足掣一掣出汗燒熱即退獨腹上不退少頃又燒每日皆然定是熱瘧此一辨也喉內必有痰一哭必嘔嘔即痰出定是熱瘧若驚風之痰盤踞乎肺必不到胃何得吐出此一辨也醫傢俱有靈心慧眼者不須辨此只須一眼一望而知面色非黃似黃非白似白精采似倦不倦面色慘慘而無潤澤毛孔爽爽而不直豎兩眼瞧人卻像個無病的光景熱瘧昭然此症多發於五六七八九月之間用清脾飲無有不效發一二日者定要服五六劑發至五六日者只須三四劑亦有誤作驚風傷寒治者或至十日二十日甚至一月不愈只須一二劑切不可以一劑不愈遂作別症換方而誤殺人性命也不知者難怪指鹿為馬在余父子兩代治之屢屢不啻黑白分明今把金針遠度何難巧繡鴛鴦又有熱瘧一日一燒燒有定期其候不冷一來只發熱或自下午起至半夜汗出便解手心肚腹熱不盡解或不自下午發不可拘亦用清脾飲以上熱瘧如小兒瘦怯者熱退或弱死去必要用六君子湯以補脾後例雜症余半出書傳惟於疑惑處辨之經驗者著之不效者刪之於書所未傳見症想出治法不過十之四五獨驚類以及熱瘧臍風辨法前所未傳推拿傳法亦誤余父子兩代於七十餘年中因症生悟由悟入神一見便知一藥便愈倘所謂前無古而後無今者非耶今出蘭亭真本慎勿視為楓落吳江凡症用藥不過一二三味甚至八九味為度獨驚癇症用至十九味何也只因群邪逞勢各臟為殃深入內地無不受害上而顛頂下而厥陰手足腹心到處波及是以攻堅削亂之兵不可缺一故王翦伐荊預知非六十萬眾不克胥此之謂凡我幼科慎不可以天保采薇湯作八寸三分帽盡人可戴也辨癇症癇雖有七種歷治惟從陰陽二癇治之為驗一癇即死咬牙抽掣痰壅喉內不省人事在日發者為陽癇面色光澤病在六腑肌表如拿不醒必灸肺俞各穴三壯即用天保采薇湯等分各一錢連服二三劑自愈一癇初發身無燒熱手足青冷口噤驚啼吐舌搖頭是為陰癇面色黯晦或從夜發病在五臟骨髓此最難治宜用固真湯加南星辨陽瘧兼癇夏禹鑄曰其症先有燒熱一癇而死拿之即蘇汗出稍定汗止又發此乃陽瘧兼陽癇也瘧是本病癇是標症急則治標先用天保采薇湯表散倍加半夏三錢連服二三劑再服清脾飲一二劑標本俱清即愈辨痓病痓病皆因風濕而成濕乃本而風則標若面目赤色無汗惡寒牙關緊急一身強硬痰涎壅盛小便赤澀一發終日不蘇先有譫語名曰剛痓乃風性剛急症屬於風是也治宜小續命湯去附子若四肢厥冷有汗不惡寒大便滑瀉不渴不語名曰柔痓是濕性溫和症屬於濕也亦用小續命湯去麻黃症如痰壅氣盛加南星半夏白茯以清痰枳殼陳皮紫蘇以順氣內熱便秘用承氣湯以下之柔痓用附子理中湯以溫之六君子湯以補之如纏綿不已則難治也如病久而復手足抽攣如角弓反張此乃血枯不能養筋治用四物湯加附子防風羌活切不可作驚癇治恐誤則殞命矣餘外孫與內侄孫兼患熱瘧見之甚真老妻見服清脾飲二劑不愈曰世上有此瘧疾敢是老眼昏花錯認了余曰能捱至四劑自愈果驗內侄孫亦以清脾飲方授持歸不服作別症醫病益甚又來強余往視余怒極老妻慰之行一到仍檢清脾飲二劑命服之余老友方桓綏訝曰有此奇症就有此奇醫俱隨命服六君子湯三劑以防去路此熱瘧認症既真不聽阻撓之一驗也烏沙夾邑庠程灼公子九歲時得病請余往治群醫在座抱兒出兩手挑破筋肉膿血淋漓慘不忍見每日夜抽掣數十餘回壯熱不退余戲問曰如此一症諸位填門治胡不愈願聞各用之藥有以竹瀝墜痰言者有以牛黃鎮驚丸言者有以天麻鉤藤定驚言者有歸咎於挑筋用火之為害者余不禁掩口胡盧此症君輩不知也交口請以症示曰此陽瘧兼陽癇也如此治法症有萬千吾不知從何處說起中一人問曰先生認法得自何書余曰唐許允宗有曰醫者意也思精則得之自我作祖何書之有眾皆默然用天保采薇湯各一錢五分半夏倍之共三兩許一服抽定燒熱減半隨用清脾飲一劑全愈與諸醫解座此挑筋無濟望色通神之一驗也鄰邑石埭沈蒼錫年五十餘僅妾出一子方二歲患病請救於余即拿精威二穴了不出聲通身燒熱面白雖慘寶色內存皮不輕浮光溜據面色不應無聲據無聲卻犯死症因問前可醫過否沈曰初起時蒙鄰嫗挑筋兩次又別請拿推數次昨有人將桃柳柔枝遍身推括晚便無聲矣余揣病久肺氣已虛屢致慘哭氣喪喪氣以致無聲惟照色用劑以天保采薇湯外加冬花一錢薄暮煎服夜半熱退此熱瘧兼癇望色審聲之一驗也徐聖緒子患驚癇不省人事約五六日緣乃伯措大伯孚曾與余同硯席邀治精威二穴拿之無聲即向肺俞重揉聲雖不出卻有累累貫珠掙不出來模樣灸肺俞各三壯用天保采薇湯倍加半夏單向大方脈素與余友善徐仲石處檢藥對聖緒云在禹鑄人信砒霜俱用得然好也是這一服不好也是這一服余臨別云服此一劑雞鳴便退燒熱果如期熱退二服全愈此陽癇已死揉肺俞探肺竅之一驗也庠友張孔邇婿邑庠王紹宗年可二十餘歲一時癇死不知人事約半月餘他醫純用連芩之劑毫不見瘳邀余看治余以症屬大方脈固辭孔邇力迫之行一見顏色便知痰患拿精威二穴不應於老龍穴一掐直視乎余有哄哄若甕里音用半夏四錢桔梗二錢枳殼防風甘草各一錢一劑稍蘇五劑全愈足見肺雖無聲非金碎何不可藥此中痰望形審竅大小皆同之一驗也竹塘陳諱春者一子十一歲患病十餘日不省人事初人見其不醒以為驚死於鞋帶穴人中掐咬破爛不堪請余往治見其唇口晦色如醬不抽不掣不渴肢冷如冰治用燈火十五元宵隨服小續命湯去麻黃一劑即蘇此望色審竅而知為柔痓之一驗也慢症人動曰慢驚余獨曰慢症蓋此症多成於大病之後或庸醫一見病愈遂不防守去路或初誤汗誤下吐瀉久而脾胃虛極故成慢症慢字緩字雖對急字而言然所以成此症者皆由父母怠慢之故或有汗出不止者聽之吐瀉不止者聽之以致汗久亡陽吐久亡胃瀉久絕脾成難起之疾故曰慢症慢症何驚之有以慢症而云驚皆庸醫見兒眼翻手掣握拳形狀似驚故以驚名之一作驚治或推或拿或火是猶兒已下井而復落以石也慢症者脾虛也眼皮屬脾脾敗故眼皮不能緊合而睡則露睛虛極則脾失元氣故兩目無神而多昏沉脾敗則枯涎無統故凝滯咽喉而有牽鋸之聲手足脾胃所司脾胃敗故四肢厥冷虛慢必生寒寒則大便瀉青而小便清利便知為慢脾之症若療驚則無驚可解祛風則無風可祛除痰則無痰可除解熱則無熱可解惟脾間枯痰虛熱往來耳治宜固真湯加天麻鉤藤或六君子湯加炮姜或理中湯加附子凡兒一到慢症十僅能醫六七蓋症至此肺心脾三臟俱虛胃氣大腸兩腑俱敗若虛而不絕雖久能生如胃氣將盡萬不可活即強藥之亦活活一二日究非真活也然非假活不足以見藥力之妙余見之甚眾如慨然領手者其症必生踟躕固謝者縱藥亦死此無他惟於面上看寶色胃間探消息生死便燎然在目矣余幼女於壬寅冬值先君辭世之會痲症有失經理冷瀉成慢幼甥同症熱瀉成慢妹婿聞遠波僧精於此道呼治之日索藥價丸如綠豆大每丸銀三錢屢服症加重余女眼閉不開約十餘日問乳母幸吮乳不輟面上寶色有存余用固真湯加附子五分服三劑眼一開頃又閉揣之藥力未及連服十劑愈甥慢雖同寒熱迥別知不可治妹婿嗔余有親疏之別藥吝參附與余妹反目遠波僧見余甥光景強壯如故滿口許其必生余作色辨曰爾以健壯為生耶獨不思熱則氣壯況熱瀉明知肺熱用參反傷乎肺不用則慢無治法將謂清肺再用參一清則脾氣即絕清不得補不得何生之有遠波默然趨去越三日死此慢症雖同寒熱迥異不可不察之驗也熱慢不多見亦學者之所宜治
