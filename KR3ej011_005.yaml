body:
  text: 卷五辨咳嗽夏禹鑄曰前書只說風寒暑濕燥火六淫之邪氣侵肺皆令人嗽又曰五臟六腑皆有嗽非獨在肺此僅言咳嗽之大綱卒未透發六淫侵肺之顏色與臟腑俱嗽之分別余憶其故必從大方脈書上採來惟照脈論症故不說到六淫侵肺的顏色亦未分疏臟腑致嗽的根由即言一一形症俱屬模糊余把六淫侵肺臟腑皆嗽這八個字上一一體出形色歷藥不爽若風寒濕三邪侵肺其候面白而畏風燒熱而無汗或頭疼或鼻流清涕唇色晦暗痰涎白色或滑而易出小便清長便知為風寒與濕氣所侵宜用疏風順氣湯或清肺飲去白朮加防風便愈火侵肺嗽與火炎無制相同方見後若燥侵肺嗽其候頭面汗出寒熱往來皮膚乾燥皮瘡瘙癢大便閉結痰涎膠黏治宜潤肺清金之劑用麥冬貝母冬花黃芩防風麻仁甘草赤芍陳皮暑氣侵肺而嗽其候口渴唇淡治宜香薷厚朴扁豆加冬花麥冬至於六淫皆嗽之說殊屬大概余著實窮究六淫之外嗽又有五一順傳一逆克一反侮一隔經傳染一水火不相交濟順傳之嗽在脾脾不能生金金無土養故嗽漢武帝金鐘自鳴東方朔曰土其母也母喪則子鳴出必有崩者久之蜀郡有奏山崩以此悟之脾虛肺嗽乃一定之理其候唇口慘白氣弱神疲小便清短大便或溏瀉淡淡白色便知脾嗽治用六君子湯自愈逆克之嗽在心心火盛則金被火傷而嗽試觀冶人爍金火烈而金躍息火則金安火剋金沸亦一定之理其候舌紅唇燥小便赤澀口氣蒸手便知心火剋金法惟瀉心用貝母陳皮甘草黃連木通杏仁麥冬五味等分燈心引煎服三四劑自愈弱克之嗽在肝肝有制伏肝始不旺如肺弱木強侮金則肺乃被侮而嗽肝侮肺嗽又一定之理其候目勇口苦宜用白芍柴胡冬花五味枳殼半夏甘草等分煎服五劑自愈水火不相交濟之嗽由腎水不能上升則火炎無制乃上刑肺金而嗽猶之易之未濟離火居上坎水居下水不得火而無功火不得水而功亦無所施水火不相交故不各得其用若既濟則為有用矣況五行惟火最烈豈止嗽耶其症涕唾帶血甚至血溢治用滋陰降火湯二三劑自愈屢治屢效案難悉載隔經傳染之嗽在胃胃有熱因染乎肺而嗽肺胃各經順傳不到逆克不及又不相侮胡為亦嗽乃由胃肺逼鄰胃司食入肺司氣出出入雖不同途卻共呼吸門戶胃熱熏蒸波及肺竅所謂失火殃魚亡猿災木者是也其候唇紅口紅作渴氣出大熱治用石膏冬花麻仁五味甘草以上諸嗽如喘加麥冬天冬如咳有聲無痰加杏仁防風有聲有痰加半夏枳殼余於本經咳嗽外復將此五種旁引曲喻無非為嗽雖出自肺家而卻有隔經之嗽理實雖明故不惜多方以譬明耳幸毋以卮言罪我江平世業醫道地距四十餘里一孫咳嗽自藥不應以形色札白之餘並來藥單乃瀉肺之味擄曰面舌唇口皆紅小便赤色余札復示以瀉心之劑後聞三劑愈此心火刑金瀉心救肺之一驗也痘後痘有專科痘中症候不載惟於痘後至緊要症附專數方一泄瀉唇口淡白瘡靨平白小便清宜用六君子湯一痘靨平白宜用保元湯一痘靨不落落過者亦平白宜用八珍湯一痘中眼內生翳子宜用兔糞焙之為末每服三四錢白水送下服至升余即散一痘後瘡靨或紅腫紫腫黑腫急宜解毒用生地連翹歸尾甘草赤芍等服三四劑毒自解郡城孝廉危東原兩嬡痘後一愆期不收一收後痘靨平白俱有微熱邀余過治見唇口慘白氣出微微並用十全大補湯服二劑熱除靨脫俱轉紅潤隨以保元湯調服之愈此望色審竅知血氣兩虛之一驗也辨諸血肺朝百脈之氣肝統諸經之血蓋營血者水穀之精氣也脾胃有傷營衛虛弱故血失常道而妄行若氣虛氣弱神瘦唇有血色者治法宜用四君子湯血虛者精神照原唇舌無色治用四物湯加參術糞前見血為近血用黃連解毒湯糞後見血為遠血用清胃湯久不止者用補中益氣湯加胡黃連吐血者胃中積熱宜用麥門冬飲或清胃湯衄血者脾熱傳肺而肺不能統血從鼻出宜六君子湯加桔梗當歸梔仁黃芩咯血者腎虛也咯如牝雞喚乳雞聲嬰兒無此症有咳嗽而吐血者庸醫多以童子癆治之誤矣此乃腎水心火不相升降火炎無制治宜滋陰降火湯夏禹鑄曰諸般失血有面色可審俱屬尋常惟血脫嗽血二種症不多見附錄效案以下較證余友陳公載之侄女七歲血吐數升身冷如冰通身筋現青色平常撲跌處青更甚唇口慘白口氣微冷此乃氣虛血脫初大方脈作肺熱迫血妄行用梔仁黃芩等味吐愈甚此固照理用劑卻不知看色之妙後余用人參黃耆肉桂麥冬甘草白茯苓二劑而愈此氣虛脫血望形審竅之一驗也咳嗽帶血方見咳嗽類用滋陰降火湯屢用屢效症無疑二故不附案辨中暑中熱夏禹鑄曰前輩云動而得之為中熱靜而得之為中暑此言甚是然中暑與中熱病形無異中暑作渴中熱亦作渴中熱說詭話中暑亦說詭話若不細審形色雖得動靜二字究何益也如探中暑說詭話乃低聲平平而說中熱發狂雄壯而說此猶恐不得其真只於口中一看舌色慘白唇無血色口氣微弱而冷便是中暑宜用清暑益氣湯立愈若唇舌皆紅氣出如焚小便赤澀定是心經中熱宜用木通薄荷煎湯再以犀角磨水一杯羚羊角磨水半杯入煎藥和服即解己亥之歲余從伯一孫方四歲患病初伯與先君交惡已久伯母呼予往治舉室阻撓且畏之曰彼孫一死禍來匪輕余曰具有兩眼不煩過慮視之口氣微微面色慘極唇舌白淡口道誕話知為中暑用清暑益氣湯一服愈穿山郡庠方紹文僅一子乃余婿十七歲抱疾以餘隻知幼科延兩方脈共治彼見口說詭話便作熱治用盡犀角連翹芩膏涼劑疾益加甚急聞於余余往見直臥如屍口氣冰冷唇舌皆白乃中暑之症誤作中熱大可怪也用清暑益氣湯一服立愈此大方脈切脈不如小兒科望色辨竅為妙之一證也辨夜啼夜啼有六一面深紅多淚無燈則啼稍息見燈則啼愈甚此心熱也遇火兩陽相搏故見燈而啼甚也其候手腹必熱小便赤推用水底撈月引水上天河退下六腑及運八卦推坎入艮藥用導赤散加梔仁薄荷天麻一哭多睡少天明則已面色青白便亦青白治宜溫下焦用備急方一為異物所侵目有所視口不能言但睡中驚悸抱母大哭面色紫黑治宜陳皮生薑茯神遠志甘草一有脾胃兩虛吐瀉少食而啼者治宜用六君子湯加炮薑木香一有心血不足而啼者其候睡濃忽悸舌色淡白而色不重宜用安神湯一有臟寒腸痛而啼者以手按其腹即不啼起手又啼此候面必青手必冷口不吮乳治用當歸白芍人參甘草桔梗橘皮等分服之外此而啼者必非病也或夜醒時為戲燈所慣無燈而啼者有之或乳母缺乳而啼者有之辨疳疾疳者干而瘦也此由寒熱失理飲食不節或因吐久瀉久痢久瘧久熱久汗久咳久瘡久以致脾胃虧捐亡失津液而成也心疳者面黃頰赤小便赤澀口舌生瘡煩渴治宜寧心丸肝疳者肌肉消瘦目胞赤腫翳生淚多白膜遮睛瀉多青色治用肝疳丸脾疳黃瘦腹大或吃土吃米吃茶宜調脾湯肺疳潮熱喘嗽鼻爛流涕宜先用清肺湯次用化䘌丸疳腫者乃由疳久脾衰不能制水故頭面四肢發腫脹甚者褐子丸大喘者不治丁奚腹大項細哺露翻食吐蛔宜蘆薈丸赤遊丹火此候由內有積熱重蒸外被風熱所感搏於血氣皮膚赤腫色如火灼或注頭上或發肢體卻非輕症入腹入腎亦能殺人宜速治之用升麻黃芩連翹各一錢大黃朴硝各二錢同煎服四五劑自愈余同袍胡道生乃孫頭患丹火接余治用前方服二劑不退又以價來請余以札復曰此症非輕非一二服可愈宜重用各味五六劑定然見效後如數服愈前歲余宗人有一女患此症余囑曰此重症也不可怠緩不聽果死淋症有沙淋者腎水為熱所結化為沙石內塞水道沙出痛止治用五淋散氣淋者小腹脹滿小便澀滯而痛用瀉白散血淋者心熱血散治用五淋散加小薊滑石車前子寒淋者膀胱冷氣與正氣交爭寒戰而後溺治用六味地黃丸加附子肉桂有心熱者用清心蓮子飲腎熱者用六味地黃丸肝熱者用柴胡梔子飲脾熱者用瀉黃散脾虛者用小異功散肺熱者用瀉白散肺虛熱者治用小異功散加炒山梔以上心熱等七種淋症辨法在辨脾心肺肝腎之欵內求之便濁尿白如米泔水久則成疳人參甘草當歸木通豬苓赤芍赤茯青皮川萆薢治之大便不通肺與大腸有熱熱則津液少而便閉治用四順清涼飲血虛燥滯不通者治用四物湯加柏子仁松子仁胡桃仁等分服之同邑紳徐梅宣公郎痘後四十日大便閉有七日他醫以承氣湯單授之余舅氏時在徐宅力薦請余往視之日血虛之極幸未通利通則不可藥矣梅宣且幸且疑硬用四物湯一服便出乃溏糞帶白色梅宣拍案叫絕曰一望即知神何至此前庸手幾敗乃事此望色審竅知非肺熱之一驗也小便不通小便不通由肺燥不能生水當清肺中之熱而滋腎火之源治宜用黃芩黃連天花粉知母麥冬茯苓木通甘草等分服之若脾濕氣不上升當健脾生金先用瀉黃散隨用六君子湯若膀胱有熱澀滯其流治用五苓散出汗出汗者寢中通身如浴覺來方知屬陰虛營血之所主也治宜四物湯加黃耆浮小麥黃連煎服有自汗者不時而出動則乃息屬陽虛衛氣之所司也治宜補中益氣湯加麻黃根浮小麥麥門冬煎服有脾虛泄瀉自汗而汗出有時者此症大虛治宜六君子湯或附子理中湯薑棗引煎服黃疸黃疸其候色黃屬脾蓋小兒由飲食所傷兼之濕熱之氣蘊積脾胃故成此症面目指爪小便遍身皆黃疸症無疑治宜地黃茵陳湯腫脹腫脹之症有二一曰氣腫先腫而後喘由脾胃虛弱脾主肌肉肺主皮膚土弱不能生金虛氣上攻乎肺行於面目遍身浮腫也治宜調脾行氣為主用五子五皮湯等分煎服輕則六劑重則十劑無有不愈一曰水腫先喘而後腫因上焦煩渴喜飲茶水脾虛不能制水水反侮土上衝乎肺流走皮膚而光腫也治宜實脾利水為主用胃苓湯又瀉後痢後瘧後諸病脾虛發腫者宜調脾胃為主用六君子湯或補中益氣湯切不可用通藥如通萬不能活如不因瘧痢諸病後突然而腫脹者方從水氣二種治之此方即大方脈家用之亦無一不效如通身不腫只有腹腫彈之如鼓聲按之卻綿軟此脾虛也宜用六君子湯加厚朴若腹腫彈之不響按之如石此單腹脹也不治之症三消三消之症實熱者少虛熱者多不足之症也若作有餘治之誤矣始而心肺消渴或脾胃消中或腎水消濁傳染日久則腸胃合消五臟乾燥精神倦怠以致消瘦四肢消渴心火動而消上上消乎心移熱於肺渴飲茶水飲之又渴名曰上消治宜蓮花飲為主次以生津四物湯川芎八分歸身一錢生地酒洗一錢知母一錢白芍用濕紙包煨一錢麥冬去心一錢川連八分烏梅肉五分天花粉七分薄荷石蓮肉蜜炒川黃柏炙甘草各五分消肌脾火動而消中中消於脾移熱於胃喜多食食無足時小便色黃名曰中消宜用石膏知母甘草人參倍加石膏外加粳米次宜生津養脾消濁火動消腎移熱於膀胱小便渾濁色如膏脂名曰下消宜用蓮子知母芡實麥冬入四物湯服之凡消症務要養脾生肺降火滋陰病自除矣總治三消以生血為主用黃連天花粉二味為末藕汁生地汁生薑汁人乳並蜜共和二末為丸每次一指而大白湯送下膀胱氣痛嬰兒小腸與膀胱氣痛在臍下氣海兩邊筋腫到腎囊邊痛不可抵治用川楝子橘核小茴香荔枝核俱焙炒為末白酒熱調三四錢一服不數服即愈呆笑兒無甚病忽然見人呵呵而笑即不見人亦然每日如是治用桔梗三錢半夏五錢木通一錢甘草五錢煎服隨於頂心百會穴艾灸二壯即愈不寐多困嬰兒不睡有二一心虛一膽虛睡中不聞人聲忽醒而不寐者此心血不足宜用人參安神丸有睡中稍聞人聲響動即驚而不寐者此膽虛之極宜用參竹湯多睡者脾氣虛弱健運之令不行而嗜臥也治宜溫補脾胃以四君子湯加木香半夏倍加白朮龜胸由感風熱凝注為痰停心滯胸咳嗽喘促肺氣脹滿攻於胸膈漸成龜胸或乳母過食辛辣夏哺熱乳亦成此症治宜寬氣化痰丸龜背由客風吹背傳入於髓故背突如龜或咳嗽久以致肺虛腎無所生腎主骨風寒乘虛而入於筋骨致精血不能流通故骨弓而駝治宜松蕊丹外以龜尿點脊背中中縫即愈論解顱囟填囟陷小兒生下頭縫不合腎主骨而腦為髓海腎有虧故不合也名曰解顱治宜六味地黃丸囟門之起名曰囟填宜大連翹飲或瀉青湯囟陷如坑者由病久血氣虛弱不能上充治宜固真湯又以狗骨炙為末雞子清調敷之乾瘦似疳兒父母平常節兒飲食從不傷脾飲食不缺欠又非病後但見逐日消瘦其症必由有所思想而難言或二三歲四五歲時母又有所生乳哺懷中多有疼愛之聲前兒從旁窺伺見其愛有所奪不能入懷吮乳惟朝思暮想久則傷脾治之非藥所及此症前所未傳今不概見余先君在日余妹歸寧見抱甥乾瘦審無他症頃見妹哺次甥長甥倚膝覺神不在舍因問予妹瘦始於何日妹曰自得次甥後經今月餘矣先君命妹哺兒之時勿令瘦甥得見哺後陽抱入懷以空乳喂之且慰之曰我只疼你如此一月果不藥而肥追思先君妙何如也神何如也天柱骨倒天柱骨倒乃項軟也由真氣虛弱客邪入腑傳於筋骨項則軟垂下而無力治宜祛風散或吐久瀉久病久而軟者治宜六君子湯加肉桂手軟者宜用薏苡仁當歸秦艽棗仁防風羌活荊芥等分服之足軟者治宜六味地黃加牛膝五加皮鹿茸等分服之余從弟禹鐸懸孫方十個月天柱骨倒弟曰弱極即要用參余曰客邪入內何可遽用弟意不果余作色拒之用祛風散作煎劑一服項稍直即命用六君子湯外加防風五劑愈五硬頭頸手足強直如木乃肝受風邪治宜小續命湯齒病口疳瘡此病由胎中受熱而成口瘡或牙床疳生走馬治宜導赤散並清胃湯如久病之後瘦弱之極難治之症重齶重齦口中上齶皮腫起如囊盛水名曰重齶牙床腫起名曰重齦俱以大針刺破去血用蒲黃敷之耳癰耳內腫及耳外腫耳外出膿或間一日膿一出或間二日膿一出治宜用黃鱔以刀斬斷滴血入耳數次或用天保采薇湯重舌木舌重舌者舌下根復生如小舌也木舌者其舌腫硬填口也皆由心脾熱極治用黃連灶心土木通連翹等分煎犀角磨水和藥服之用朴硝紫雪白鹽每五分用竹瀝調敷即愈余於丙午科同從弟鐸再從侄謨鄉試白下侄忽患重舌弟伴向外科用刀刺破流出如雞蛋清歸寓又腫如此兩回不愈予執舌乃心苗立方用黃連黃芩木通枳殼甘草二劑舌消一半喉痰忽壅余揣必是誤用黃芩之弊蓋心火刑肺肺已不安誤將肺瀉焉不痰壅於是去黃芩加五味二錢一劑並愈此因苗治臟照症立方見藥不可誤用之一驗也鶴膝風此候由腎氣不足兩腿細小膝骨腫大如鶴膝之狀治宜屈膝散或用六味地黃丸加牛膝鹿茸又有瀉痢久而成此症者紅腫作痛成膿治用補中益氣湯如腫硬不痛而色白者治不愈也痛風四肢上或身上一處腫痛或移動他處色紅不圓塊參差腫起按之滾熱便是痛風治用羌活獨活五加皮威靈仙秦艽防風桂枝前胡如下身加牛膝各一錢煎服數劑自愈邑庠方玉相幼子左手左足各曲貼肉痛屈不伸用前方煎服五劑愈如大人須用酒煮每夜儘量飲每味一兩五錢煮酒約五六斤飲畢即愈此余創方屢效不爽冷水風腳背上與趾上及解谿鞋帶諸所塊痛不可言一痛幾死用青磚一塊火內燒紅以木桶盛之將老醋澆入磚上以大人手伴兒腳懸於磚上蒸之氣莽則將腳稍遠氣溫則就磚桶口以綿絮之類圍塞不令氣泄一蒸即驗如神迅雷所驚其候抽掣形狀與前驚無異隻手掌內橫直紋痕皆是深黃顏色此因驚膽其色故黃拿蘇用鼓對兒輕輕敲起漸漸加重重擊二三聲持去鼓以解疑即服參竹湯以寧膽穿山林宅諱祥者一子四歲臘月被爆竹驚死拿蘇如父母喚聲略重又驚死與飲食時先以食示之再做聲便不驚其父亦業幼科投以棗仁遠志等味不效至余告其顛末余曰此膽家受病作心家醫誤矣余授以參竹湯二劑愈天疱瘡此由風邪毒氣客於皮膚搏於血氣而生始生如湯燙作泡一破漿出成瘡治用生地升麻藍葉山梔大黃各一兩剉碎用豬油八兩文武火煎色變濾去渣瓷器盛之塗患處痱瘡其狀如粟粒色赤面瘡夏月多生頭面或遍身用天保采薇湯等分煎服黃水瘡由濕熱與血氣相搏其瘡初生碎小後有膿汁浸淫成瘡用雄黃雌黃川烏各一兩松香三錢為末亂髮一團燒灰存性豬油六兩熬化再入三味煎至發消盡以綿濾去渣入二黃攪勻盛器塗瘡上惡核瘰癧此患由風熱毒邪與血氣相搏鬱結成核如貫珠於耳項之間腫硬白色搖奪不動而有根者便是瘰癧或潰爛成惡毒如用藥多有不效莫妙於用燈火至易而至效余亦曾患此用燈燋兩衣即愈今故以燈火燋法垂於身之背面圖如瘰在左則燋左邊瘰在右則燋右邊前自頸上耳腳下起離六分地一點一點直下乳次過脅上至肺俞穴到頸上耳後止在瘰上周圍亦燋第二次照原路空處補之便愈若只有核而搖得動者便不是瘰癧初起紅腫便是癰疽不可作瘰癧治偏墜腎囊子或一個腫大一個小用香薷厚朴薑汁炒枳殼木通扁豆生薑甘草車前葉煎服或用萬年青根約五寸去黑皮搗碎白酒煎服不吃渣亦愈莖腫痛莖即陽物如腫用黃連木通各一錢煎服即愈腎囊腫腎囊腫如琉璃燈樣用塘內水上無根浮萍以篩盛之下用水一盆置篩於盆上烈日曬乾為末每服二錢即消腫痛如用鍋焙萬萬不幹灸霍亂霍亂灸崑崙穴七壯起死神效灸瘧母瘧母灸肺俞穴各三壯背對臍穴三壯神效灸脫肛脫肛灸龜尾穴症暫用補中益氣湯十服此乃肺氣下陷灸肚大青筋肚大青筋堅如鐵石於臍之上下左右離五分地各灸二壯即消灸犬傷犬傷用青磚上青苔和牛糞捶爛如被瘋犬傷於患處艾灸三壯即愈灸蛇傷蛇傷於患處艾灸三壯以上灸法俱用獨蒜截片遮患處盛艾於上灸之疔瘡惡瘡癰百膏異方水粉黃蠟各五錢寒水石研細用水飛過一兩乳香去油二錢麻油三兩先入鍋滾過入蠟化開再入水粉共寒水石熬成入乳香攪勻成膏貼之即愈貼骨疔口掛角各疔瘡發背腦癰乳癰大人小兒同治丹疔瘡發背腦癰鬢疽乳癰一切無名腫毒用飛龍奪命丹服之便有頭先不痛不癢者服之便痛便癢未成者內消已成者即潰其毒化為黑水從小便中出此乃惡腫毒中之靈丹用蟾酥乾者酒化三錢膽礬一錢海羊蟲二十個雄黃三錢輕粉五分蜈蚣一條炙黃去首足麝香片腦各五分共為細末酒為丸如綠豆大每服三丸用蔥白三根長二寸自嚼爛吐在男左女右掌心以前丸裹於蔥內熱水酒三四鍾送下厚被蓋之取汗約頓飯之時再用熱酒催助汗出其毒即消如汗不出其毒乃重再服三丸汗出即效只是發背疔瘡方可取汗此方余于都門許宅香火院住持小西天喇嘛僧處傳來不論大小老幼人如有前患用之無有不效
