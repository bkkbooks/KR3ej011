body:
  text: 卷四淋症夏禹鑄曰痘出於臟淋出於腑淋乃大腸主之毒氣蒸肺故發咳嗽先輩書未嘗齒及淋症蓋以其輕而忽之也卻不知表症雖輕毒侵肺腑亦多性命攸關余經歷甚衆費手居多因不惜筆力詳著於篇以杜嬰兒淋症之患流行淋症其候燒熱必發咳嗽聲必稍啞麵皮微有腫樣兩腮顏色微紅此吉兆也如發出不快及不透發或紅點見面偶挾風邪而隱或醫人不知誤除燒熱隱而不見腹內作痛治之神莫神於天保采薇湯聖莫聖於天保采薇湯只須一服即發出或有不盡發者再加一服從未有不效者如肺臟先虛又加大腸毒氣攻肺麵皮像澆薄的式子慘白浮浮光光溜溜便是肺氣已絶在精威二穴對拿其聲不出必是死症藥之無濟有淋方見點隨即收入或瀉青水審非風寒為害唇色慘白口氣微微此乃內虛不能送毒不可分利止瀉惟用八珍湯以托之外用蔥半斤許白酒煎遍身擦之如再不透發只額上稍見些微惟用六君子湯循循調治自愈有淋初發熱時心火盛極刑克肺金致淋不出必先用黃連木通等分服之再用防風荊芥葛根升麻南星枳殼赤芍桑皮柴胡桔梗甘草煎服之即發有痢疾兼淋症若淋見點急用香薷桔梗枳殼黃連厚朴木通升麻赤芍車前煎服淋瘡透發而治痢疾此棄輕從重之説不可不知本邑陶一公涯玉之子淋症發熱方兩日醫人誤為除熱淋伏不出形狀似驚差役請余治面色花雜喘急不嗽必有內毒於太陽穴以口涎擦之皮內隱有紅點知是淋毒內攻無燒不出用天保采薇湯倍加升麻乾葛一服額上見點色不紅起面色唇口慘淡無澤知為內虛即用固真湯一服通身發熱陶公驚怖余曰淋非帶熱不出仍服天保采薇湯一劑通體透發愈此見面色花雜便知內毒之一驗也培繼樓同學庠友方恆綏一子淋症隱而不出形症甚凶邀余治見其面色慘白口氣微冷唇舌淡白大便泄瀉即用八珍湯一服額稍見點恆綏因侄前淋症殞於泄瀉力迫止瀉余曰分利更虛不允見口吻間覺以瀉關性命勉強用五苓散果止而額上紅點即隱又用十全大補湯內托外用蔥酒蒸引卒不透發余值事往郡躡後札示皮上每發一泡破即成黑窟附他醫攻毒方單余札復曰肌肉脾屬破即成窟乃脾虛之極何可攻毒惟用六君子湯顧脾為主果效此望色審竅萬無一失分利虛脾即此可見之一驗也思誠堂同學友措大方薪衍第五郎患淋症初醫者不知淋候用六一散以除燒熱邀余過治見其舌純紫兩唇燥裂大小二便皆祕聲鼾不已即用黃連八分木通黃柏各一錢服下大便刮白如冷痢然在座者口吻覺為涼劑所致余亦躊躇滿志豈臟腑苗竅此症獨不相符毫不首鼠問前醫退熱所用何劑薪衍曰六一散余便恍覺下元為六一寒冷所滯致火不降灼無疑矣隨以炒鹽久尉臍下仍用前味黃連倍加服之方下大便燥結與黑棗無異可見苗竅辨真治定不爽之一驗也辨傷寒附寒極似熱小兒之十指俱冷以三指按額俱熱身壯熱面赤而淡不動必掣此傷寒之症也表散法開天門分陰陽推三關體厚則大發其汗揉太陽並外勞宮運八卦推艮入坎症輕推之自愈重則用元宵火定之體弱隨發汗隨止女反是治用芎蘇飲服之有寒極似熱者面色紅如水紅桃花口渴而唇不幹燥舌不紅紫大便青色小便清長此寒極也似熱者因面有紅色口有渴形故也治之與前法同如口作渴大便祕小便赤是內有熱而外傷寒也宜先表外而後清裡為主表用芎蘇飲里用白茯半夏陳皮連翹木通枳殼甘草煎服本郡田三公祖之公孫方二歲抱風寒燒熱症郡醫見燒有驚悸便作驚症治數日不愈余以三指按額俱熱兒十指俱冷用芎蘇飲一劑留飲席未解內小童報曰小相公熱退矣此燒有表裡不可不辨之一驗也余於癸丑科會試盛京有鑾儀衛正堂許公乃孫方歲半患傷寒症初延太醫院幼科失表後於朝房內余同里員外郎陳是庵道及於余余即日來貴池館親邀往治但見身冷如冰痕毛差差面色慘晦不知人事知寒邪內伏用天保采薇湯一劑囑曰夜發熱則明日來治不則莫可如何矣夜果發熱仍用前湯一劑熱又解許曰發熱退熱藥同效異真出奇也余曰尋常症在表感一劑便解如令公孫邪被藥誤伏內昨一劑攻邪邪到肌表表見邪自是作熱仍以原方加追一劑表解熱除無甚奇也許曰前是庵備道年翁乃幼科白眉今若此洵名下無虛矣以百金壽余辭曰晚兩代治救嬰兒從不受謝一文再四面璧更欲延請余入太醫院又辭曰老母在堂晚在都門白雲頻望承盛意心領之可矣許乃止此關門殺賊之一徵也方伯張存儒初生有公郎抱驚風患初郡中醫作夾食用消導劑症加甚後余用半夏四錢生薑一錢防風二錢一服即愈此藥用當而通神之一驗也余邑張中尊嬡患病邑中醫曾治十餘日不愈會余到邑中尊得聞接余治婢方抱出離座五六步外望見面上光光浮浮毫無寶色余曰不須抱近請回中尊問症若何余曰肺氣已絶不可治矣明日果死此望色而知為死症之驗也辨夾食傷寒小兒十指俱熱我按兒額三指俱冷其候身熱或吐或瀉或不吐瀉口必惡食腹必浮脹拍如鼓聲或作痛是也推法開天門分陰陽男女同男重揉太陽發汗體弱揉太陰止之女反是推上三關三十退腑六七下運八卦重揉艮宮於大指面旋推補脾曲兒小指重揉外勞於第二指大腸位側推到虎口以止瀉不瀉不推重按掐中指一節以止吐不吐不掐於左腳湧泉穴左轉揉之止瀉不瀉不揉少頃右轉揉之止吐不吐不揉女則右轉右揉止瀉左轉左揉止吐推畢即用燈火臍輪四燋胸口一燋用水酒麴一枚火煨黃色研末白湯送下即愈重則用消導二陳湯加柴胡紫蘇等味煎服珩山孝廉方韻皇乃孫發吐燒熱微掣吐輕熱重餘子壻方平階初業斯道投天保采薇湯一劑不效邀余一見知為內傷飲食外挾風邪用藿香正氣散一服即愈余以湯名曰天保采薇取其治外治內之意用之不當雖多奚為在余壻以為症屬內傷外感湯屬內外並治渠見不為非是然不知症似社鼠城狐重鎮何可輕發此學者之所宜知而宜慎也辨腹痛腹痛臍以上屬火臍以下屬寒其因不一有寒痛熱痛傷食痛積滯痛氣不和而痛脾虛而痛肝下乘脾而痛蛔動而痛數種寒痛則面白口氣冷大便青色小便清利痛之來也迂緩而不速疾綿綿不已痛時以熱手按之其痛稍止肚皮冰冷是也推法曲兒小指重揉外勞宮推上三關揉臍五十藥用乾薑肉桂等分煎熱加木香磨水入服之自愈熱痛則面赤口氣熱口渴唇紅大便祕小便赤時痛時止痛來迅厲腹形如常不腫不飽彈之不響以熱手按之其痛愈甚肚皮滾熱此真熱也推用下六腑水底撈月蓋熱痛主心脾兩熱用燈心車前伏龍肝加木香磨水稍許入服傷食痛者必惡食眼胞必浮腫或瀉下酸臭腹必飽脹彈如鼓聲或身作熱是也如氣不旺者不宜取瀉只用消導二陳湯積滯痛者今日傷明日傷逐日傷之而滯於脾胃間不以飲食得其傷不痛既有滯而後以乳食傷礙故痛也面色黃噯氣醙大便醙臭便後痛減足冷嗜臥不思飲食是也治宜枳殼檳榔木香下之下後即以小異功散補之氣不和而痛者兒下地後或地多濕兒臍受風以裹肚束臍過緊不知兒體漸長束帶未松則上氣不通下氣以故內氣不和故作痛也審其非寒非熱問其母而臍果有束縛之弊則氣不和之痛必矣治以木香磨水服之隨用燈火臍輪六燋臍下氣海一燋心口窩一燋其痛即止大兒之氣不和者其候眼胞不腫面色不黃飲食如故腹腫可如鼓聲搖其頭而噯氣是也宜用木香陳皮枳殼甘草服之脾虛痛者其候面無血氣微黃帶微白大便少而色白治以補脾開胃為主用六君子湯加橘皮肝木乘脾痛者肝木克脾脾虛不勝其克則肝氣無所泄故乘脾之衰而作痛也其候唇白口中色淡面多青色痛則腹連兩脅重按其腹則痛止起手又痛是也治用四君子湯加柴胡白芍蛔痛者腰曲撲身口流清涎痛久不歇少頃又痛或一時或二時而止或歇半日又痛面黃唇白此蛔痛也治用使君子去殼火煨吃十餘粒少頃又吃即止以上嬰兒腹痛口不能言何以知之蓋兒痛必哭無故而哭者痛也哭聲雄慘而雙眉蹙皺是也如使君子食之不止莫妙於苦楝子樹根皮約一二兩許水煎一茶鍾吃下蟲即盡出但體弱者不可輕用又有一種奇痛一痛只大叫幾聲痛痛痛即抱胸暈死余家一女犯此症先君在日余見將女面撲地用冷水一盆以女膝著水上於委中穴澆水狠拍粗筋腫起用銀針傍筋打入二針針出血流叫一聲痛即蘇隨用冷水滾水各半連吃一二碗立愈記先君曰此急痧也與轉筋火差似如平常腹痛從未有一痛而即死者急痧之辨緊記在此夏禹鑄曰嘗觀內經有曰胃虛則吐胃熱則嘔此説殊屬大謬何也余屢屢見吐吐固有虛常亦有熱嘔固是熱卻亦有寒此余非非議前人蓋見之多而治之效也二症各有虛熱不可拘執惟望面色唇舌之間紅則熱而淡則虛斷無有誤至於泄瀉出少而緩曰泄出多而勢急曰瀉泄則症輕瀉則重凡以所瀉之色驗之治無不效辨吐胃虛發吐其候面白神疲不熱不渴口氣溫和而帶微冷額前微汗治宜助胃膏胃熱發吐面赤唇紅煩渴溺赤口氣蒸手宜用熟石膏七分八分研細末以茶送下胃氣不和發吐其候惡食此由積滯在胃復為傷食搖兒之頭便噯氣治用火酒麴一枚火煨黃色研細白湯調下用枳殼木香陳皮半夏香附服之有盛夏外感暑氣吐者宜六和湯有霍亂而吐者吐不出者手足厥冷臍腹之上絞痛名曰轉筋火治用滾水一碗冷水一碗相和飲下即愈有內傷飲食外感風邪而吐者身熱眼燒疲倦治用藿香正氣散有傷風嗽吐者治用清金飲辨瀉夏禹鑄曰吐從面色辨之不爽瀉更宜辨所瀉之色暴傾下迫屬火水液澄清屬寒老黃色屬心肺脾實熱宜清淡黃色屬虛熱宜補青色屬寒宜溫淡白色屬脾虛宜補醬色屬濕氣宜蒼朮燥濕醙臭屬傷食宜消導二陳湯脾虛作瀉瀉下白色或穀食不化或水液澄清其候面白神疲唇口慘淡舌白口氣溫冷治宜理中湯加附子或六君子湯脾熱作瀉瀉時暴注下迫便黃溺赤口氣蒸手煩渴少食治宜五苓散加山梔仁有氣虛下陷瀉者宜補中益氣湯其候與脾虛差同有傷食兼滯瀉者其候噯醙氣吞酸脹滿一痛則瀉一瀉痛減治宜用大腹皮神麯麥芽山楂白朮木香檳榔如食已消痛已止而瀉不止者乃脾失清升之氣宜補中益氣湯若食消而腹猶痛乃脾痛也宜小異功散有肝瀉者瀉青稠黏乃肝木乘脾治宜麥冬桔梗白朮白茯人參木香酸棗仁甘草先瀉數日已止又瀉隨發驚此症多不可治蓋瀉而又瀉脾敗之極加之外邪由肺克肝肝又動風克脾脾敗將死不受肝克故肝風烈極毫無泄處如祛風解熱元氣將盡將謂療驚不能救脾將謂救脾驚不能止無法可治辨吐瀉夏禹鑄曰內經有曰胃虛則吐脾虛作瀉脾胃俱虛吐瀉兼作此言極謬若先瀉後吐面白神疲不熱不渴額有微汗乃脾胃虛寒也宜理中湯或小異功散或六君子湯若先吐後瀉面赤唇燥煩渴溺赤乃脾胃有熱也治宜五苓散加竹茹煎服又有積滯在脾不能運化水穀而吐瀉者宜用消導二陳湯有長夏夾暑吐瀉者宜用六和湯余髫年硯席友陳公載嬡患吐症適余抱風寒因延大方脈用溫胃劑吐益甚帶疾往視口唇紅麗氣出蒸手舌色紅紫用熟石膏一錢研碎以茶一碗送下稍止隨加一服立愈在大人苗竅尚驗況嬰兒乎後又患吐色竅俱同仍用石膏卻不甚應揣之下元或有寒氣用炒鹽尉腹仍服石膏即愈可見苗竅顏色從不一誤余於歲癸丑北上到會館適陳是庵幼郎脾瀉將慢付余治問曰曾服參否是庵曰如服一分便爬上了壁余心以為南北或亦有異轉思初到都門恐孟浪來誚以六君子湯去人參連服二劑了無一效辭接別醫良久一醫擁輿至館去後余請所發劑視之劑屬消導因問彼何人斯是庵曰此名震京都之鄭小兒科也余曰久瀉將慢尚可再用消導之藥用之命不可知矣乃止余便不以是庵之言為正硬用六君子湯倍加人參且外加附子五分兩服即愈是庵嘆曰素聞妙手今果然矣此辨色審竅勿以人言為信之一驗也辨痢疾夏禹鑄曰丹溪云痢無止法以通利為主此言亦不盡然何也痢疾有寒有熱白者虛寒也紅者實熱也治宜調脾為主若染一二日遍身壯熱膿血稠黏裡急後重腹痛者宜用承氣湯以下之或用木香檳榔丸若虛怯者不可下病久身涼自汗宜用補中益氣湯挾熱而痢純血宜用四順清涼飲或黃連芍藥湯挾冷而痢純白或乳食不消者宜用理中湯有濕熱之毒熏蒸清道上致胃口閉塞而為噤口者宜用人參黃連石蓮子有痢久胃氣虛則不能乳食而為噤口者宜用理中湯或六君子湯有積毒之氣上衝而嘔惡者宜用人參敗毒湯有胃氣虛寒而嘔惡者宜用附子理中湯有痢後脾虛不能制水而遍身浮腫者宜用六君子湯外加蒼朮厚朴豬苓澤瀉黃連芍藥有痢久脫肛者經曰肺氣虛寒由脾虛而金無所養故大腸虛脫而下陷也宜補脾溫胃用固腸飲有積盡而痢久不愈乃脾氣下陷宜用補中益氣湯或四君子湯若初起宜用薑茶散有夾暑熱而痢下赤白相兼者用清暑益氣湯加香薷飲余長男之日五歲時與幼甥同患痢疾男素脾弱痢起腹並不痛痢下純膿白色中帶藍色口氣微冷不用通利即以六君子湯服之甥痢純紅遍身有風疹用四順清涼飲加防風柴胡兩藥各器同爐煎姻家誤以男藥與甥服之風疹即隱氣喘促睡鼾余急以天保采薇湯與服疹復出喘止仍用前湯數劑愈此可見脾虛之極不必清利硬用補劑熱痢宜清不可用補之一驗也辨瘧疾附陰虛似瘧瘧疾皆由冒感風寒暑熱而發丹溪有曰若無汗要有汗以散邪為主若有汗要止汗以扶正氣為先此千古不磨至之論也發時有一寒一熱身重骨節疼痛自汗多嘔者濕瘧也由汗出脫衣沖冒風寒或渴極過飲冷水或冷水浴身所致有食瘧者食所傷由飲食過度傷寒所致俱用柴胡前胡青皮陳皮蒼朮白朮白茯甘草豬苓澤瀉知母貝母厚朴半夏黃柏等分薑棗引服一劑以清之於發瘧日之五鼓空心以前方加常山檳榔草果仁等分煎服以截之即愈如久瘧不止致中氣弱極名曰脾寒用四獸飲加棗薑服五六劑自愈夏禹鑄曰有陰虛似瘧竟作瘧治者這般人卻沒有一毫心思一線想頭夫謂之曰似則兩症相去原是星淵即曰似瘧亦只似其瘧之脾寒試問普天下人可有瘧一起而就成脾寒者是必始於清之無法繼又截之無方或從不服藥相延日久才到脾寒之症明明有這一條來路若一見每日下午身有潮熱冷狀颼便作瘧治獨不思到瘧有來路況脾瘧由重減輕陰虛由輕加重兩症判然竟不知別此一種心竅真不可理解陰虛似瘧如潮熱稍重於作寒治用四物湯加人參如心肺肝有熱雖湯內已有熟地再外加生地如作寒稍重於潮熱四物湯外加黃耆人參甘草等分參減半如潮熱作寒俱輕只用四物湯不須外加如女患此加紅花二三分
