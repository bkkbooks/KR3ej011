body:
  text: 卷六藥性小引醫家治病如經生制藝然病有表裡重輕猶題有大小搭截病有來路去路用藥有清源塞流之法猶題有上文下文作文有承上含下之規藥味猶貴詮題面之字眼藥性猶字眼義意之淺深體認不明便成差謬不觀之卜子夏乎於素以為絢詩只因一句滑讀過便不解為字之義則醫家下學於百藥之性可昧昧焉而不一為之究耶余前按症列單因病用藥固矣然茫不知性倘症變裁方何所措手爰約略幼科常用百味之性列於篇左以便詳究以供採擇焉藥性賦幼科摘要寒性犀角解乎心熱羚羊清乎肺肝澤瀉利水通淋而補陰不足薏苡能理腳氣而風濕堪除車前子明目止瀉能清小便栝蔞子潤肺止嗽下氣寬中黃柏瀉膀胱而補腎薄荷消諸腫以清風寬中下氣枳殼緩而枳實速療肌解表柴胡次而乾葛先柴胡瀉肝止兩脅之痛枳實削積除久滯之痰百部治肺熱於咳嗽可止梔子涼心腎而鼻衄最宜升麻力消風熱發散瘡痲足陰引氣升陽導藥遊經有四麥冬清心解渴專除肺熱清肺隱伏之火生肺不足之金金箔乃鎮心而安神志茵陳除濕熱而治胎黃石膏墜頭痛兼清脾胃天冬定肺喘又潤心肝大黃能通閉結朴硝降火通關前胡除內外之實痰滑石利六腑之澀結熟地黃滋腎水補益真陰生地黃涼心火肺脾解熱赤芍藥行血而療腹痛煩熱亦解白芍藥補虛兼瀉肝火新血能生香附子理氣有消浮退腫之功知母滋陰乃瀉腎除蒸之用貝母清熱痰而利心肺寒痰愈滯桔梗通肺竅而傳諸藥肺部引經黃芩瀉大腸之火肺寒勿用常山攻痰結之味剿瘧尤強葶藶子止肺喘以通水氣水藕節消瘀血而止衄紅大黃朴硝乃脾虛送死之鴆毒黃連貝母乃寒痰伐命之斧斤夏禹鑄曰大黃猶之一員猛將朴硝卻是偏裨如敵勢猖獗負踞要衝用之搴旗折馘一出成功若民遭困苦之餘平定安集尚恐不及亦輕為調遣不惟無地樹功而且敵梳兵篦輕用之害慘不可言果肺火焰天大腸毒結一用則瞬息通關至於臟腑俱虛或氣虛腫脹誤用則掃盡元氣不刃而殺人矣熱性生薑發散除乎胃嘔胃熱切不可用五味止嗽且滋腎水初嗽不可遽加川芎能祛風濕清頭補血紫蘇力能表散亦可助脾麻黃散寒邪以發表根止盜汗而固虛白朮消濕痰而溫胃利水道以強脾丁香快脾胃以止吐逆附子療虛寒大壯元陽當歸補虛以養血獨活祛風以治瘋厚朴溫胃且消嘔脹除痰亦驗肉桂可療冷瀉止汗如神橘紅皮開胃去痰導壅滯之逆氣山茱肉治頭昏暈止下部之遺精夏禹鑄曰附子之力猛用之貴小心謹慎虛寒者受之如枯木逢春若壯氣不衰誤為過問必髮直衝冠以是知脾氣兩虛元陽亡失虛極生寒體如冰雪口中寒氣逼人一用如石投水不特莫之逆也且同流濕就燥如只虛而不寒即寒不到陰極地位形勢猶能自立一用如水投石不特莫之受也而且水火參商是知宜用不怕朝夕不宜卻怕分釐可為輕用附子者作一箴規溫性木香理乎滯氣半夏主於風痰蒼朮燥脾去濕山藥脾濕能醫藿香葉止吐溫胃能消喉響之寒痰款冬花潤肺去痰又定久嗽之壅喘草果仁溫脾胃以止瘧威靈仙宣風氣以除疼茴香卻膀胱疝氣之痛秦艽去肢節腫痛之風檳榔墜痰導水治痢疾之後重如神訶子生津潤肺療滑瀉之沉疴似聖防風祛風杜仲益腎橘核止腰疼疝氣之急痛麻仁潤肺及六腑之燥堅黃耆實腠理益元氣外固表虛之汗肉豆蔻溫中止霍亂更助脾臟之虛生薑皮可消浮腫鉤藤鉤專定驚風夏禹鑄曰黃耆之性溫內分實腠理益元氣外固表虛之盜汗內托陰證之瘡瘍乃脾家氣分之第一種固虛藥也故仲景有曰黃耆甘草以益元氣之內人參肉桂調和營衛之中人動曰提氣只知道一個氣字那知道人身上氣有兩種主乎脾者氣之元也主乎肺者氣之發也脾之元氣猶每歲之為生為長為收為藏內運之氣是也肺發之氣猶山嶽之晴嵐村落之煙霧溪壑之陰雲碧海之樓市外發之氣也不能分別兩種各有所司猥曰提氣嗟嗟黃耆何曾走著肺家又何曾理著肺氣把扶正氣的一味聖藥看壞了致令脾氣弱症卒不敢用不亦深可悼哉余推其故多因肺部有邪氣喘氣促那醫家不去清肺之邪而遽為扶脾之氣適湊其會氣愈喘愈促便誣賴到黃耆身上不然黃耆與肺何涉而亦亂道提氣耶若以余言為謬試到明醫處把黃耆溫內分實腠理益元氣固盜汗這幾個字幾種性細問一番庶可瞭然於心矣平性青皮利脾胃快膈削積天麻定驚癇燥濕祛風甘草調燮陰陽解藥百毒生用乃瀉心經之火人參寧心潤肺助胃開脾生津扶氣肺熱反來傷肺之憂南星去驚風痰吐之苦棗仁有補心去怔之功大腹皮消浮下氣亦能和胃遠志肉遺精能止而寧心木通豬苓併為利水之用蓮肉醒脾更有清心之妙白茯苓補虛勞心脾俱到白茯神寧心臟驚悸能安麥糵有入脾化食之力脾虛莫用小麥有止汗養心之功浮者為佳神麯消食恐傷脾氣百合止嗽兼斂肺虛連翹瀉六經之火排卻瘡膿大棗有健脾之力中滿勿嘗烏梅治便血瘧痢兼用竹瀝治痰壅寒滯宜防夏禹鑄曰人參是世間一種靈丹若脾虛作瀉胃虛發吐心虛驚悸肺虛作嗽津亡作渴氣虛失血病久成慢諸類用之如入芝蘭之室蓋善與善相親也肺熱氣旺風邪熱邪燥邪火邪諸類用之如入鮑魚之肆蓋邪正不肯並立也凡今之人因前庸手誤用傷人相沿視為鴆毒不深可恨哉臟有淫邪不可遽用邪去正衰不可不用遽用者傷人不用者亦殺人也
