body:
  text: 卷一九恨一恨挑筋割肉五臟之病豈盡在筋挑斷不知當那一味藥六淫之賊豈盡在血血出又不知退那一經邪這一種挑筋的如對予說出理來予便不恨一恨病兒見面寒熱虛實茫然不知輒曰死作活醫藥之不效死不任過一藥偶中活即居功死症能生對予說出理來予便不恨一恨見兒燒熱並不知燒從何感熱自何生亂推亂拿致兒大啼大叫汗出熱解偶爾撞著便自稱神既自稱神緣何有效不效對予說出理來予便不恨一恨不知症候藥與病反不曰自己用藥不當且曰兒母有失護持對予說出理來予便不恨一恨活症屢藥不效名醫一藥成功不曰自己不知且曰他合時機對予說出理來予便不恨一恨以丸散為欺人之具其實不值一文且曰此丸此散真是無價不論中病與否解包投服不愈則多方以藥本為辭丸散既屬無價投服病胡不瘳對予說出理來予便不恨一恨動用牛黃竹瀝貝母為除痰要藥痰有寒熱熱痰見此真似滾湯潑雪寒痰見此竟是雪上加霜不論寒熱概投兒服對予說出理來予便不恨一恨必用柴胡退燒燒熱有表裡之殊柴胡專屬解表之味脾虛腎虛氣血兩虛諸燒熱亦用柴胡對予說出理來予便不恨一恨用湯頭有內減外加之說加減原在湯頭內看臟腑之有虛有實酌藥味之宜多宜寡間或清病之來路塞病之去路外加一二味此是變通妙手如曰內可減外可加則四君子加兩味便成六君子十全大補減兩味便是八珍對予說出理來予便不恨夏禹鑄曰餘生平來凡嫉我欺我負我餌我以及無故加我者輒過而忘獨於幼科庸醫而恨之且恨之有九何也常見艱於嗣息者一旦舉子慶也如何及病付醫輕者重之生者死之其飲恨也又何如余抱公憤人也遂引人恨為己恨然恨之正所以覺之也覺之則睡漢驚來轉腳便步百尺竿頭悟到醫家三昧方見卓溪叟以九恨作醒人擘頭之一棒也十三不可學一殘忍之人必不惻怛不可學一馳騖之人必無靜氣不可學一愚下之人必無慧思不可學一鹵莽之人必不思索不可學一猶豫之人必無定見不可學一固執之人必不融通不可學一輕浮之人必多忽略不可學一急遽之人必期速效不可學一怠緩之人必多逡巡不可學一宿怨之人藉此報復不可學一自是之人必以非為是不可學一慳吝之人必以此居奇不可學一貪婪之人必以此網利不可學予以此十三種人為不可學非外之以為必不可學也苟絕此病先能自醫又何不可學之有十傳一兒啼哭無聲前輩俱作死症以為肺絕故也獨予先君於拿之無聲者審出肺氣未絕一藥即生而予亦經驗過歷歷不爽生死關頭何可秘而不傳一驚風傷寒熱瘧三種相似前輩俱未能辨誤醫誤死不知凡幾獨予先君辨出驚風的模樣傷寒的光景熱瘧的認法透徹無遺一經醫治無有不生而予亦經驗過歷歷不爽生死關頭何可秘而不傳一兒左手之三關六腑大指之脾位五指之上下兩腳之左右前輩無不誤傳獨余先君悟出至理闢盡各處差謬闡出部位根源推無不效補無不應瀉無不神而予亦經驗過歷歷不爽毫釐千里何可秘而不傳一兒臍風前輩只知風入臍內以致撮口噤口卒不知風入深淺死生有異予獨悟出逆克至理見外知內治無不退經驗過歷歷不爽生死關頭何可秘而不傳一兒慢症前輩多作慢驚亂推亂拿亂掐亂火以致汗愈亡陽痛愈傷脾獨予體貼慢字不作驚治惟補脾虛經驗過歷歷不爽生死關頭何可秘而不傳一兒胃有實痰藥解不散惟有取法前人取之多有壅築喉內不吐出又不下去因不敢取予偶見修養家作練功大睡法眼翻氣築時於氣海穴以手指曲節抵之一放即活予因悟及取痰不出又不下者以是法行之果即下復取便出經驗過歷歷不爽此因詩悟禮觸類旁通萬病俱可因端起悟何可秘而不傳取喉內痰將兒中指捋至尖數下推湧泉穴左轉不揉以指對抵頰車穴以耳挖爬舌上即吐一兒有驚風痰熱虛實表裡前人俱用推拿且曰小兒肚腸脆嫩不可服藥獨予先君云急驚風痰非推拿不效臟腑虛寒非藥味莫瘳此予兩代因病用推用藥經驗過歷歷不爽好竽鼓瑟必不相宜何可秘而不傳一兒有病前人以四季之五行按五臟之五行以藥味之四性合天時之四季其理固是然不知棄輕從重之妙如當夏宜用黃連等味以瀉心不宜用棗仁等味以補心理也設使心經虛極或怔悸不眠或汗出如雨補耶瀉耶當夏宜用五味等味以救肺不宜用桑皮等味以瀉肺理也設使肺經熱極或大便閉塞或熱血妄流瀉耶救耶此種學問余從不固執惟相其緩急權其標本棄輕從重不拘時令祗照病醫卻無不好經驗過歷歷不爽深恐膠柱鼓瑟者流不敢輕用藥味何可秘而不傳一望兒顏色不錯證之苗竅相符藥之又與病合若服一二三劑病猶照常不除又不加甚切不可因人言藥不合症半路更方蓋在我望色既真辨竅既稔效不見速無非病深藥淺藥力未到譬之舟人駕舟兩岸遼闊一時難到我既認定風色亦只把定舵牙活握篷索一任浪湧兼天鏖一鏖自然到岸如把持不定在半江中或辭篷轉舵則斷無不覆之舟予兩代經驗過歷歷不爽似此成敗關頭何可秘而不傳一兒病患舉世幼科皆於兒第二指麵筋紋細摹細看以形色論症候以透關決死生予兩代以醫術濟人共約七十餘年治活嬰兒不下百千萬數皆以望面色審苗竅為主治無不神間亦摹看筋紋了無證驗似此迷津道岸何可秘而不傳摹看手指筋紋乃醫家異教說夏禹鑄曰摹看手指筋紋乃醫家異教蓋指麵筋紋生來已定豈因咳嗽而變為反弓驚積而化為魚刺膈熱而結為流珠肝氣粗而來蛇狀之理即曰能變能化亦不過反弓知咳嗽魚刺知驚積流珠知膈熱蛇來知氣粗而已外有何知況二指一面僅大小二腸所屬非五臟諸經並見之地即曰並見一指長不過寸許闊不過分余設也膈熱而兼氣粗氣粗而兼咳嗽則流珠與反弓蛇來並相撕混請從何辨又訣曰初關乍入宜支退筋透三關命必亡常見筋透三關竟無病者亦有病時透三關而必不亡者此種道理殊不知解余兩代經過不驗不忍隱而不言見之者幸勿執迷不悟治病不可關門殺賊說禹鑄曰治病不可關門殺賊臟腑之病必有賊邪或自外至或自內成祛賊不尋去路以致內伏是謂閉門殺賊如傷寒賊由外入法宜表散心火賊自內成清利為先是知降心火而不利小便除肺熱而不引大腸治風熱而不發表藥夾食而不導消痢初起而不通利瘧始發而遽用截方凡此皆閉門之弊不第不能殺賊而五臟六腑無地不受其蹂躪則閉門之害可勝道哉凡有心幼科者又不可不知也治病不可開門揖盜說禹鑄曰治病不可開門揖盜若臟腑有虛外雖傷感誤為表散分利惹來別症是謂開門揖盜試以脾虛作瀉論之脾虛惟恐補之不及一用分利則正氣日下而脾愈傷便來脾慢之症譬之六國之病在弱離橫合縱乃季子補救之策解約散縱自開吞併之門是亂臣亡國與分利崩脾無異理也至於肺虛誤為發散心虛利水肝虛抑肝諸類當從脾虛分利而類推之可也湯方內更換藥味說禹鑄曰在湯頭中更換藥味有宜不宜猶文字上更換字眼有妥不妥一般更換字眼有慧思鄙見之殊更換藥味亦有鄙見慧思之別如範希文作子陵祠堂記有歌曰先生之德時李太伯在座以風字易德字洵是慧思李太白詩人煙寒橘柚而黃魯直以家園字易煙寒字便是鄙見至於醫家用四物湯以補血內有熟地若心有火而血熱以生地易熟地卻是慧思若心無火血不熱而亦以生地易熟地便是鄙見此等學問只可與知者道難與不知者言也業醫道者當留心焉看病秘訣禹鑄曰凡小兒病有百端逃不去五臟六腑氣血症雖多怪怪不去虛實寒熱風痰病縱難知瞞不過顏色苗竅症即難辨莫忽略青白紅黃面上之顏色苗竅乃臟腑氣血發出來的顏色之紅黃青白乃寒熱虛實獻出來的業醫者能於此處做工夫便得吾家之秘訣推法用蔥姜煎汁浸染醫人大指先從眉心向額上推至二十四數次從眉心分推至太陽太陰九數再自天庭至承漿各穴掐一下以代針法再於大陽太陰或發汗或止汗再將兩耳下垂尖捻而揉之又將兩手捧頭面搖之以視其氣再看寒熱向手推三關六腑及運八卦隨分推胸口及揉臍推委中畢再揉肩井至於別穴看症再加揉法推三關退六腑運八卦男女俱在左手人以男右手為女之左手獨不思右掌無八卦若亦有八卦則震居西兌居東艮居乾而坤居巽豈後天八卦之定理而為女子之推拿遂變其位置耶況男女心肝腎脈俱在左手若女以右手為左則心肝諸脈可在右手否推法以兩手圍握兒手將兩大指在總筋中分推各往側邊兒眼翻上者將大指甲在小天心向掌心下掐即平兒眼翻下者將大指甲在小天心向總筋上掐即平夏禹鑄曰大指面屬脾畫家畫手掌不把大指畫正面乃畫家之正法前人只得以脾土字寫在側邊後人誤認以訛傳訛遂以大指之側邊為脾余故將前掌圖大指移作正面此因脾土畫圖之權宜又因口訣有曰脾土曲補直為推見有曲字便把兒指一曲著則側面居正故愈以側面為脾那曉得曲補之說曲者旋也於指正面旋推為補直推至指甲為瀉此前人一字之訛遂成流弊莫救今人推之不效皆由穴之不真前人傳之已誤後人幸勿再誤少商穴兩大指背挨甲處各燈火一燋專治臍風外勞將見小指曲著重揉外勞宮祛臟腑之寒風後谿推往下補腎推往上是清腎利小便夏禹鑄曰五指梢尖俱屬下前人作上誤矣譬諸草木根是本梢為末末下也不辨可知前人又每以左足為右足獨不想到人在堂居中朝上坐卻是西邊為左邊如此明白顯易的道理胡為乎還錯了若女則右足為左足地道尚右也男左手直骨背面為三關屬氣分推上氣行陽動故為熱為補男左手直骨正面為六腑乃血分退下則血行陰動故為寒為瀉其兩邊側里屬陽氣陰血交界之地以此處作三關六腑之氣血無所適從補瀉何可合用五臟陽也何女以推上為寒為涼所謂陽極陰生是也女陰道故從陰生處推之六腑陰也何女以退下為熱為補所謂陰極生陽是也故女從陽生處推之訣曰腎水一紋與後谿推上為清下補之小便閉赤清之妙腎虛便少補為宜禹鑄曰四臟俱推上為補下為瀉何腎與四臟相反蓋四臟居一身之上而腎居下腎虛則推四臟之氣往下以滋腎故曰下補腎水混濁則小便閉赤若再往下推則閉愈甚一往上提疏通水道而小便自清故曰推上為清此上下清補有異若不發明上下之理恐人疑推腎之上下兩字有訛則遺害不淺故識之合骨穴乃兩骨合縫處用元宵火兩手各一燋看側骨之兩邊明明是正面後人多錯看了奈何奈何老龍穴於驚死時在精威二穴拿不醒再於此穴一掐知痛者生不知痛者死可向肺俞穴里揉以探之夏禹鑄曰前人因合骨穴故畫側手圖只能畫一面不能畫三面故以三關六腑寫在兩邊按圖雖在兩邊而推畫圖之情兩邊原是正面後人不體其情以側手圖之側邊遂執為兒手正面之側邊作三關六腑不大可怪哉古人畫圖繪穴想無不真多因粗心者皆不能揣情度理一錯看過以訛傳訛相習不察餘力闢前謬非故示異也由幾番折肱體認得來的後之君子當毋以妄誕目我湧泉穴男左轉揉之吐即止右轉揉之瀉即止左轉不揉主吐右轉不揉主瀉女反是驚來若急大墩穴拿之或鞋帶穴對拿如嬰兒弱極在大墩穴按之無脈又在解谿穴再按又無脈弱到十二分地位不必醫如兩處有脈即用人參一二分服之自轉不可多用恐弱不能受反加一死醫者知之驚時若身往前撲即將委中穴向下掐住身便直若身後仰即將膝上鬼眼穴向下掐住身即正定驚元宵燈火囟門眉心臍心臍輪合骨鞋帶各穴共十五燋臍風燈火囟門眉心人中承漿兩手大指少商臍心臍輪共十三燋死症辨前輩有死症訣然於中治之卻有不死者醫家不可棄而不治大沖即大墩無脈是弱症屬不足直視搖頭是風症屬有餘二者相兼覺無此理倘有相兼不治症也如止有一斷非死症魚口自動忽作鴉聲此脾有痰而肝有風若祛風豁痰卻非死症蛔蟲盡出不加燒熱補脾即安亦非死症面黃四肢腫若黃有寶色補脾行氣自消卻非死症至於鼻門黑燥兼以肚大青筋手抱頭上兼以汗似油淋囟門腫起忽陷成坑只犯一宗猶非死症若果並見必死無疑卓溪家傳口訣前輩相傳不效者刪之兩代經驗過者補之亦有訣傳不明者出己見以闡發之嬰兒十指冷如冰便是驚風體不安十指梢頭熱似火定是夾食又傷寒握之恐不真再以兒手指貼吾面試之不爽以吾三指按兒額感受風邪三指熱三指按兮三指冷內傷飲食風邪入以上探病法一年之氣二十四開額天門亦此義自古陰陽數有九額上分推義無異天庭逐掐至承漿卓溪以掐代針行血氣此乃開首推法傷寒推法上三關臟熱專推六腑間卓溪六腑推三關應一三關推十腑應三推多應少如只推不應恐發熱則動火過涼又有滯為調燮血氣之中始不偏啼哭聲從肺里來無聲肺絕實哀哉卓溪若因痰蔽聲難出此在醫家用妙裁卓溪病在膏肓不可攻我知肺俞穴能通不愁痰築無聲息艾灸也能勝上工卓溪百會由來在頂心此中一穴管通身撲前仰後歪斜癇艾灸三丸抵萬金腹痛難禁還瀉血亦將灸法此中尋張口搖頭並反折速將艾灸鬼眼穴更把臍中壯一艾卻是治療最妙訣卓溪肩井穴是大關津掐此開通血氣行各處推完將此掐不愁氣血不周身病在脾家食不進重揉艮宮妙似聖再加大指面旋旋字不可忽略推脾若初傷推即應頭疼肚痛外勞宮揉外勞宮即見功疼痛醫家何處識卓溪眉頭蹙蹙哭聲雄古人只曰頭疼肚痛非此辨法何以知之心經熱盛作癡迷天河引水上洪池掌中水底撈明月六腑生涼那怕癡嬰兒臟腑有寒風試問醫人何處攻揉動外勞將指屈此曰黃蜂入洞中揉掐五指爪節時有風驚嚇必須知若還人事難甦醒精威二穴對拿之膽經有病口作苦只將妙法推脾土卓溪口苦醫人何處知合口頻頻左右扭古人只曰口苦非此辨法何以知其口苦耶大腸側側字不可忽推到虎口止瀉止痢斷根源卓溪不從指面斜推入任教骨碎與皮穿揉臍兼要揉龜尾更用推揉到湧泉腎水小指與後谿推上為清下補之小便閉赤清之妙腎虛便少補為宜小指正面屬腎水卓溪小兒初誕月中啼氣滯盤腸不用疑臍輪胸口宜燈火木香用下勿遲遲身不燒熱啼聲雄壯白睛青色有肝風鼻破生瘡肺熱攻卓溪祛風卻用祛風散指頭瀉肺效與同鼻準微黃紫庶幾卓溪奇紅帶燥熱居脾大指面將脾土瀉灶土灶土即灶心焦土名伏龍肝煎湯卻亦宜太陽發汗來如雨身弱兼揉太陰止太陰發汗女兒家太陽止汗單屬女眼翻即掐小天心望上須將下掐平若是雙眸低看地天心上掐即回睛卓溪口眼相邀扯右邊肝風動極趁風牽若還口眼頻牽左定是脾家動卻痰腎水居唇之上下風來焉不作波瀾雙眸原屬肝家木枝動因風理必然右扯將兒左耳墜左去扯回右耳邊將耳垂下扯卓溪三朝七日眼邊黃便是臍風肝受傷急將燈火十三點此是醫仙第一方卓溪效見推拿是病輕重時莫道藥無靈療驚定要元宵火非火何能定得驚若用推拿須下午推拿切莫在清晨任君能火還能藥燒熱常多退五更叮嚀寄語無他意恐笑先生訣不真推拿代藥賦前人忽略推拿卓溪今來一賦寒熱溫平藥之四性推拿揉掐性與藥同用推即是用藥不明何可亂推推上三關代卻麻黃肉桂退下六腑替來滑石羚羊水底撈月便是黃連犀角天河引水還同芩柏連翹大指脾面旋推味似人參白朮瀉之則為灶土石膏大腸側推虎口何殊訶子炮姜反之則為大黃枳實湧泉右轉不揉朴硝何異一推一揉右轉參朮無差食指瀉肺功並桑皮桔梗旋推止嗽效爭五味冬花精威拿緊豈羨牛黃貝母肺俞重揉漫誇半夏南星黃蜂入洞超出防風羌活捧耳搖頭遠過生地木香五指節上輪揉乃祛風之蒼朮足拿大敦鞋帶實定掣之鉤藤後谿推上不減豬苓澤瀉小指補腎焉差杜仲地黃湧泉左揉類夫砂仁藿葉重揉手背同乎白芍川芎臍風燈火十三恩符再造定驚元宵十五不啻仙丹病知表裡虛實推合重症能生不諳推拿揉掐亂用便添一死代藥五十八言自古無人道及雖無格致之功卻亦透宗之賦
