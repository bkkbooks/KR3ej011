body:
  text: 附錄諸湯方天保采薇湯羌活前胡半夏陳皮柴胡赤芍白茯川芎枳殼厚朴桔梗蒼朮升麻葛根藿香獨活甘草犀角解毒湯治胎熱丹毒犀角赤芍生地黃白芷甘草連翹荊芥防風牡丹皮木通導赤散治夜啼木通生地甘草竹葉黃芩大連翹飲治胎熱等症連翹赤芍歸尾木通甘草防風荊芥理中湯治胎寒等症乾薑白朮甘草人參若加附子名附子理中湯鉤藤膏治內吊肚痛乳香沒藥木香殭蠶共為丸鉤藤湯下地黃茵陳湯治胎黃生地歸尾豬苓天花粉赤芍赤茯苓茵陳澤瀉甘草芍藥湯治夜啼泄瀉白芍澤瀉甘草大茴薄荷木香茱萸生薑六君子湯治脾胃虛寒等症陳皮半夏人參白朮甘草白茯生薑大棗引固真湯治慢驚四肢冷不省人事附子甘草人參山藥黃耆肉桂白朮白茯薑棗引保元湯治汗多變慢驚黃耆人參甘草生薑三片大棗一枚水煎服姜半散治吐不止將成慢驚半夏生薑肉桂調脾湯治脾疳陳皮白朮丁香人參訶子青皮甘草六味地黃丸治腎疳牡丹皮熟地黃白茯苓山萸肉酒蒸去核白澤瀉懷山藥上為細末煉蜜丸如桐子大空心滾水送下蘆薈丸治丁奚哺露蘆薈人參白朮白茯山藥木香陳皮青皮麥芽神麯當歸各三錢檳榔兩個麝香少許上為細末豬膽打麵糊為丸如麻子大清水湯送下小異功散治先瀉後吐脾胃虛冷人參白朮橘皮白茯薑棗為引煎服黃連芍藥湯治先吐後瀉黃連芍藥豬苓澤瀉白茯白朮甘草五苓散治吐瀉豬苓白朮白茯澤瀉肉桂消導二陳湯導痰消食健脾陳皮半夏白茯白朮蒼朮神麯香附砂仁甘草六和湯治暑瀉陳皮半夏白茯甘草黃連厚朴藿香香薷加扁豆木瓜胃苓湯治長夏暑瀉澤瀉陳皮白茯豬苓厚朴白朮甘草蒼朮助胃膏治胃氣虛寒嘔吐人參白朮白茯甘草山藥木香丁香藿香砂仁訶附丸治飧泄訶子肉灶心土黑附子為末米糊丸如粟米大米湯下十六味肥兒丸治脾胃虛弱人參白朮白茯山藥薏米芡實蓮肉甘草陳皮山楂麥芽砂仁黃連澤瀉芍藥連翹上為末蜜丸如彈子米湯下承氣湯治裡急後重腹痛痢疾朴硝大黃枳實厚朴木香檳榔丸治食積黑醜檳榔木香神麯大黃上為末生薑汁糊丸如粟米大米湯下補中益氣湯黃耆人參甘草陳皮白朮升麻柴胡當歸四順清涼飲治中焦熱白芍當歸生地甘草柴胡人參敗毒散治積毒嘔惡柴胡前胡川芎羌活獨活白茯枳殼桔梗甘草人參生薑引四君子湯治脾胃不調等症人參白朮白茯甘草薑棗引薑茶飲治赤白痢陳茶生薑黃蠟鹽車前葉四獸飲治虛瘧白朮人參白茯草果半夏甘草陳皮烏梅薑棗引人參養胃湯治瘧寒多熱少陳皮半夏茯苓人參蒼朮厚朴草果藿香姜引清瘧飲柴胡枳殼青皮半夏白朮黃芩厚朴豬苓白茯澤瀉陳皮甘草貝母知母前胡隨用截方前方加常山草果檳榔姜引煎服參蘇飲人參蘇梗桔梗前胡半夏乾葛陳皮枳殼杏仁木香甘草茯苓姜引五子五皮飲治腫脹蘇子山楂子蘿蔔子葶藶子香附子桑皮橘皮大腹皮茯苓皮生薑皮瀉黃散治濕熱腫脹赤茯黃連黃柏黃芩山梔澤瀉茵陳瀉白散治腫熱甘草桔梗陳皮桑皮地骨皮四物湯調益榮衛川芎當歸熟地白芍麥冬飲治吐血久不止麥冬黃耆當歸人參五味子生地清胃湯治糞後見血山梔子生地牡丹皮黃連當歸茵陳湯治黃疸茵陳梔子黃柏祛風散治天柱骨倒防風甘草羌活細辛黃芩白芷薄荷當歸川芎滋陰降火湯治陰虛痰結當歸地黃白芍黃連白茯知母天花粉蓮子黑元參甘草麥冬燈心引五淋散治血淋赤茯赤芍山梔仁條黃芩當歸甘草燈心一團引清脾飲治熱瘧或熱多寒少青皮半夏黃芩甘草白朮白茯柴胡陳皮草果厚朴薑棗引人參安神湯治心血不足驚悸不安麥冬人參當歸黃連棗仁生地茯神安神湯治心血不足驚悸人參半夏棗仁茯神當歸橘紅赤芍五味子甘草姜引寧心丸麥冬五錢去心寒水石一兩白茯甘草牙硝山藥各五錢硃砂一兩龍腦一字上為末煉蜜為丸如芡實大每服半丸砂糖水磨下如慢症用人參白朮煎濃汁化下肝疳丸五靈脂夜明砂龍膽草天麻乾蟾頭全蠍一個蟬蛻川芎蘆薈黃連青黛防風上為末豬膽汁浸為丸麻子大每服十丸薄荷湯下化䘌丸治肺疳蕪荑青黛蘆薈川芎白芷胡連川連蝦蟆灰各等分為末豬膽汁浸糊為丸麻子大每服二十枚臨臥杏仁湯下褐子丸治疳脹蘿蔔子一兩青皮陳皮檳榔赤茯黑牽牛莪朮五靈脂各五錢木香二錢五分上為末糊為丸綠豆大每服十五丸桑皮紫蘇煎湯或蘿蔔湯下五味二陳湯治夾暑傷寒吐瀉陳皮半夏白茯甘草厚朴香薷黃連山楂麥芽神麯木通澤瀉香薷飲治暑熱香薷厚朴扁豆黃連清心蓮子飲治溺血麥冬地骨皮黃芩甘草白茯黃耆柴胡車前石蓮肉人參瀉青湯治囟填羌活川芎梔仁龍膽草當歸防風各等分大黃減半竹葉引清金飲治傷風嗽吐前胡杏仁桔梗桑皮半夏甘草旋覆花薄荷陳皮水煎小續命湯治剛柔痓病麻黃人參黃芩川芎芍藥甘草杏仁防風防己肉桂附子芎蘇飲川芎蘇葉陳皮半夏柴胡桔梗枳殼乾葛白茯甘草瀉肝湯車前木通生地歸尾山梔黃芩龍膽草甘草各五分松蕊丹治龜背松花枳殼防風獨活各一兩麻黃前胡大黃桂心各五錢為末蜜丸黍米大每服二十丸粥飲下寬氣化痰丸治龜胸大黃三分杏仁百合木通桑皮甜葶藶天門冬石膏各五錢上為末煉蜜丸黍米大食後臨臥白熱水化下柴胡梔子飲柴胡山梔白茯川芎白芍當歸丹皮牛蒡甘草等分水煎子母並服固腸飲治久痢不止木香黃連當歸白芍人參白朮白茯甘草訶子肉水煎屈膝散治鶴膝防風薏苡仁牛膝苦參女便浸曬何首烏男便浸曬各一錢殭蠶天花粉荊芥穗各五錢肥皂核肉一兩鹿茸五錢共為粗末每用三錢同冷飯糰四兩牡豬油六錢黏米綠豆各一撮水四碗煎至二碗分作二次溫服豬乳膏治胎風胎驚牛黃硃砂各少許取豬乳調抹兒口中清暑益氣湯治傷暑煩熱黃耆升麻人參白朮陳皮神麯澤瀉黃柏當歸青皮乾葛五味甘草水煎服八珍湯人參白朮茯苓甘草川芎當歸熟地白芍薑棗引藿香正氣散治傷脾胃外感寒邪藿香紫蘇大腹皮陳皮桔梗甘草茯苓半夏神麯厚朴白芷薑棗引疏風順氣湯治風寒發喘紫蘇乾葛桑皮前胡麻黃杏仁甘草水煎服清肺湯白朮茯苓陳皮薄荷南星桑皮細辛甘草桔梗備急方治夜啼內吊煎蔥湯淋洗其腹又用艾絨烘熱包熨臍腹十數次其痛即愈蓮花飲甘草知母蓮花須川蓮仁栝蔞仁五味子人參乾葛白茯生地竹葉參竹湯麥冬人參竹葉甘草半夏小麥粳米陳皮生薑
