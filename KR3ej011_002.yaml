body:
  text: 卷二闡明五臟生克以知補母瀉子卓溪夏禹鑄曰萬物以土為母而人身亦然陳非宋問曰物賴土生有形可見人身亦以土為母何以知之曰脾屬土也以是知脾土為一身之母也有脾土而後生肺金肺金生腎水腎水生肝木肝木生心火心火生脾土此五臟相生之序也有生亦必有克不克則太旺無制故肝木克脾土脾土克腎水腎水克心火心火克肺金肺金克肝木此五臟相剋之序也業醫者不明五臟生克之定理則治病兼補兼瀉之法從何而施如脾家虛極法雖用補補之不足必兼補心苟不明相生之理焉知補心以補脾如脾家熱極法雖瀉脾然瀉之不克必兼瀉肺不明相生之理又焉知瀉肺以瀉脾生我者謂之母克我者謂之賊邪如肝家虛極則肺邪乘肝補肝必兼祛賊賊去而肝自安不明相剋之理又焉知瀉肺以補肝舉此兩臟餘臟皆可類推望形色審苗竅從外知內禹鑄曰望聞問切固醫家之不可少一者也在大方脈則然而小兒科則惟以望為主問繼之聞則次而切則無矣經云切而知之之謂巧夫小兒六脈未全切無可切而巧亦無所用其巧問而知之之謂工小兒於未言時問之無可問即於能言者問之多不以真對是問之不必問而工亦無所用其工聞而知之之謂聖小兒初病之時聲音或不失其常至病久而氣喪氣喪而聲失聞之無可聞而聖又何所見其聖況書有曰哭聲不響者多死而亦有不至於死者何無非泥其聲而不得其肺之絶與不絶故也吾故曰以望為主曰五臟之體隱而理微望從何處曰體固隱矣然發見於苗竅顏色之間者用無不周理固微矣乃昭著於四大五官之外者無一不顯中庸所謂費而隱顯之微者不可引之相發明哉故小兒病於內必形於外外者內之著也望形審竅自知其病按病推拿藥石見效之速未有不如響之應聲者內有臟曰心曰脾曰肺曰腎曰肝五臟不可望惟望五臟之苗與竅舌乃心之苗紅紫心熱也腫黑心火極也淡白虛也鼻準與牙床乃脾之竅鼻紅燥脾熱也慘黃脾敗也牙床紅腫熱也破爛脾胃火也唇乃脾胃之竅紅紫熱也淡白虛也如漆黑者脾胃將絶也口右扯肝風也左扯脾之痰也鼻孔肺之竅乾燥熱也流清涕寒也耳與齒乃腎之竅耳鳴氣不和也齒如黃豆腎氣絶也目乃肝之竅勇視而睛轉者風也直視而不轉睛者肝氣將絶也以目分言之又屬五臟之竅黑珠屬肝純是黃色凶症也白珠屬肺色青肝風侮肺也淡黃色脾有積滯也老黃色乃肺受濕熱疸症也瞳人屬腎無光采又兼發黃腎氣虛也大角屬大腸破爛肺有風也小角屬小腸破爛心有熱也上皮屬脾腫脾傷也下皮屬胃青色胃有寒也上下皮睡合不緊露一線縫者脾胃虛極也面有五位五臟各有所屬額屬心離火也左腮屬肝震木也右腮屬肺兌金也唇之上下屬腎坎水也五臟里也六腑表也小腸心之表小便短黃澀痛心熱也清長而利虛也胃乃脾之表唇紅而吐胃熱也唇慘白而吐胃虛也唇色平常而吐作傷胃論大腸肺之表閉結肺有火也肺無熱而便閉必血枯不可通下脫肛肺虛也膽乃肝之表口苦肝旺也聞聲著嚇肝虛也膀胱腎之表居臍下氣海之右有名無形筋腫筋痛腎水之寒氣入膀胱也面有五色一曰紅紅病在心面紅者熱一曰青青病在肝面青者痛一曰黃黃病在脾面黃者脾傷一曰白白病在肺面白者寒一曰黑黑病在腎面黑而無潤澤腎氣敗也望其色若異於平日而苗竅之色與面色相符則臟腑虛實無有不驗者矣五臟各有所司從外治內心乃一身之主通身皆心司之專主血專司神如驚悸不安屬心虛淚無因而淚者心熱也汗身瘦不動而汗者心虛也莖陽物也腫者心熱以上有病俱從心治脾專司元氣氣弱者脾虛氣又分司汗氣虛盜汗肌肉消瘦者脾虛痰實痰動者脾濕也虛痰動者脾虛也思慮過則傷脾以上有病俱從脾治肺專司聲音弱者肺虛也有聲不出者痰蔽也聲撒者肺氣不斂也無聲者肺絶也熱出在肺皮毛破癢者肺燥不潤者肺虛腠理肉外皮內不密則汗出以上有病俱從肺治肝專司血血弱者肝虛汗又分司汗血虛自汗筋抽掣者肝風以上有病俱從肝治腎專司骨齒耳以上有病俱從腎治脾肺內有傷皆從外入如父母舐犢過愛則飲食傷脾護持疏失則六淫傷肺至於心腎肝無有傷處到成人後縱情欲多房事傷腎守錢虜去財谷傷心四畏至時忍惱傷肝乃如之症遠近便多卓溪雖有良方惜乎鞭長莫及辨臍風夏禹鑄曰三朝之內便是臍風如七朝之外定然不是前人只曰風由臍入腹以致撮口噤口並不曾説出一種理來余思嬰兒出世剪落臍帶帶口有水風固乘水由臍入腹然腹與唇舌相去甚遠而唇撮舌強何故把賊邪逆犯之理一悟乃知風入於腹始附於肝肝木也風則附木而鳴目肝之竅兩眼角故有黃色風入於肝必逆犯乎脾鼻準脾之屬故準頭又有黃色入於脾必逆犯乎腎兩唇屬腎故色黃口撮入於腎必逆犯乎心舌乃心之苗故舌必強直到此風火交熾亡之必矣余悟臍風顛末至此自問亦不自知語曰思之思之豁然通之殆此謂歟臍風初發吸乳必較前稍松兩眼角挨眉心處忽有黃色宜急治之治之最易黃色到鼻治之仍易到人中承漿治之稍難口不撮而微有吹噓猶可治也至唇口收束鎖緊舌頭強直不必治矣一見眼角鼻及人中有黃色而唇不撮緊者曲兒小指揉外勞即用燈火於囟門眉心人中承漿兩手大指少商各穴一燋臍輪六燋未落帶於帶口火燃既落於落處一燋共十三燋風便止而黃即退矣此火攻之法何異呂祖壺中藥盧公再生方哉願普天下為兒父母的依余看治即十百千萬億中斷無一孩死於臍風者余常見大方脈書垂效案無一姓氏似屬虛誕卓溪叟附録必書姓氏斷不敢謬如有借名是書一出將何以對效案中諸君子乎兩代效集充笥不能盡載聊取疑難之症約略附之各症之末非矜己也用以資事斯道者之相較驗云長山庠友儲二有一日抵掌下偶道及從前舉子俱不育於臍風余為約日後生子三朝內招余過望此患可除後果如約將兒抱出兩眼畔黃色方興用燈火十三燋即退此望臍風不爽之一驗也余邑中嶧桐居士劉伯宗先生乃郎佶三婦初舉嬡臍風延至七日口不吹噓亦不撮緊兩眼角黃色深集溶溶鼻準並溝畔黃色淡淡身上微燒見之甚訝從未有臍風能延至七日者以眼角鼻上黃色濃淡揣之知其脾土稟賦甚旺風難遽入以故爾爾余重揉外勞用燈火十三燋攻拔肝風於鼻上並左右溝里加火三燋以截去路用防風一錢煎服立愈此臍風異症之一驗也辨胎寒胎寒下地後或半日一日內通面皆青如靛染口不吮乳先有啼聲後復不啼而昏迷者是也觀兒兩眼鼻準無黃色口又不吹噓定是胎寒先於精靈威靈二穴對拿緊並將崑崙穴拿緊其聲稍出即用十五元宵火斷之或聲不出亦用此火則聲必出乳必吸青色必漸退矣然此症須防作吐胎寒者臟腑皆寒胃先納乳胃寒不能納故必吐治用人參一分桔梗一錢白朮三分藿香五分服之自愈亦有發之遲者胎有寒而外無感冒則遲之二三日之間胎有寒而下地復感其寒故即發於半日一日之內面必青色唇白瀉白或昏睡或腹痛或口不吮乳四肢必冷曲手握掌或啼哭不已皆胎寒也治之切勿認為臍風當以辨臍風之法辨之治宜用理中湯加附子遲久或變為盤腸內吊治宜用鉤藤膏此症由娠母好食生冷坐臥貪涼所致辨胎熱胎熱者通面大紅紅雖赤子本色恐人不能辨蓋本色紅而淡淡而正熱色深紅而燥燥而色雜如滿口熱氣莽莽或舌腫而紅紫口氣蒸手或大便閉結小便短赤目內紅赤此皆胎熱也如牙齦腫硬不能吸乳用銀簪於牙上下合骨處刺破出血而乳自能吸隨用連翹一錢伏龍肝二錢車前一錢煎服或用大連翹飲此症由娠母喜睡火炕好食煎炒所致辨胎毒發丹此症由娠婦常浴熱湯或久臥火炕或過食煎炒辛辣其候丹發頭面四肢赤色遊走不定先用天保采薇湯表散次用大連翹飲或傷乳發丹大便閉結宜用四順清涼飲通之自愈辨胎驚胎風驚與風名異而症同如面青搐搦口噤身熱背強者是也若目直竄視最為難治宜先拿精威二穴並崑崙穴少頃即曲兒小指重揉外勞宮隨用元宵火定之即服豬乳膏此症由娠母性強撒潑顛撲損傷心血應之於胎外復感挾風邪相觸而發辨胎黃胎黃由娠母感受濕熱傳於胞胎故兒生下面目通身皆如黃金色壯熱便祕溺赤者是也治用地黃茵陳湯余同學庠友方孟居舉子剛出世少頃通面青如靛染昧爽呼門振袂往視知為胎寒之極拿精威二穴無聲曲小指揉外勞隨用元宵火加肺俞二燋少商各一燋即乳余知必吐預用藿香煎之果吐與服之早食候天庭青退至亭午通面皆紅矣此執色驗症之一徵也方姓有子通其人者生子七日內不吮乳適余在郡請別醫誤作臍風余歸要路留治見其唇燥極面色紅中帶暗燒熱亦甚揣不吮乳之故必是牙關腫硬用針於骨合處各一針血出放手即乳用連翹一錢灶心土二錢木通五分煎服即愈此望色審竅之一驗也余男之云同年泮友胡增奇生男四日內地距四十里許不便邀看來與余説面上黃色身有微燒余揣臍風黃色必不通面因問眼內何如渠説亦有黃色勢樣余曰定是胎黃以地黃茵陳湯方授之愈此問色知症之一驗也辨蒸變小兒生下三十二日一變六十四日一蒸變者變生五臟蒸者蒸養六腑長血氣而生精神益智慧也積五百七十六日乃除蒸變必燒熱其狀似驚耳尻俱冷口內上唇有白泡如魚目粟米大者是也蒸變之候口唇舌色俱照尋常無異燒熱雖有重輕精神卻不喪失口氣必不暴戾輕則三四日解重則六七日除不可妄投藥餌聽其自愈辨脾實熱虛熱脾實熱鼻必紅燥唇必紅燥而裂牙之裡旁必掀腫而紅紫大便色必深黃或身熱不食或精神疲倦或熱吐熱瀉治用伏龍肝五錢熟石膏一錢服之自愈脾虛本無熱所以熱者虛使然耳初由脾虛而復傷飲食其候身微熱鼻微紅而微汗口雖渴而唇必慘白口氣必微弱以手按之而不蒸手或食而不化或見食而不喜食或瀉或吐此皆虛熱之症也治宜補脾為主用六君子湯加藿香有脾虛腹腫或因傷食而起以指彈之如鼓聲以手捺之如綿軟切不可用通藥宜用六君子湯加厚朴或腳腫加大腹皮如腹腫彈之不響捺之鐵硬上有青筋作肚大青筋論四肢俱腫作腫脹論如脾虛腹腫一用通藥十有十死連用六君子湯十劑自消辨脾濕脾濕由脾弱不能制水水反侮土其候面暗而不澤唇晦而不紅或痰易動而不化或食稍傷而即瀉瀉下澄清如水或身上發熱此脾濕症也治用蒼朮白朮陳皮白茯苓半夏甘草如脾土傷食而生痰者治用消導二陳湯加炮薑辨肺熱肺寒肺虛肺熱右腮紅至申酉時其紅更盛或大便閉結或身熱或喘急而咳嗽或嗽不出而面壅赤無痰或口渴氣莽或鼻門乾燥且燥破生瘡皆肺熱也治宜用瀉白散肺虛面色慘白外無感冒治宜用五味子白朮白茯苓陳皮款冬花甘草肺寒治用參蘇飲其肺寒及寒極似熱治法在後傷寒類辨心實熱虛熱心熱額色紅燥或舌紅紫或舌紅而腫或小便赤赤而澀澀而痛或燒熱皆心熱也推法運掌從坎入艮退下六腑水底撈明月引水上天河治用犀角解毒湯虛熱症面白唇舌慘淡小便清利口亦作渴治用人參白茯神遠志白朮甘草服三四劑自愈辨心經熱極似寒額不紅舌不紅腫小便不赤澀乃熱蘊於心不形於竅不傳於色口氣如焚睡中齒如錯鋸口必狂言啼哭淚多此熱極似寒也推法同心熱藥用犀角磨水飲之或大連翹飲辨心熱昏迷似驚其候燒熱平常似有驚而不抽昏迷無知治用半夏陳皮桔梗各二錢煎服後用甘草三錢連翹木通各一錢服之自愈九思軒措大方遴萃舉子才兩月症屬脾濕動痰傳入肺竅乃妻呼挑筋婦挑之症加甚且曰挑遲了不可愈余往視之拿卻無聲審音知痰入肺竅先用推拿兼使燈火隨用半夏二錢桔梗枳殼白朮各一錢服之稍愈遴萃聞余言半夏合症重用之微動燥氣余即用赤芍等味解之全愈此脾濕動痰挑筋無濟用藥輒效之一驗也余長女甫四歲身上微熱口説詭話且無所不説面色紫黃唇色略紅舌尖獨燥口氣如火精神不弱口不作渴據面色卻是中暑但病值三月暑非其時以舌尖口氣並精神揣之定是熱極似寒用犀角磨水一杯服之少頃一吐即愈此熱極似寒審竅探情之一驗也辨燒熱夏禹鑄曰燒熱之因不一不可概作風寒今照症發明人當探本肺部燒熱有五一感冒面色寒滯兩頰或似水紅桃花鼻流清涕惡風痰壅治宜芎蘇飲以表之一受暑面色慘淡唇口舌皆淡白色四肢困倦神氣萎靡自汗煩渴或説詭話宜用清暑益氣湯一本髒髮熱鄰家有流行淋痘者不可誤除一本臟有虛面色白口氣微唇舌淡色或發嗽熱必輕微治宜用五味子麥冬冬花白朮白茯陳皮等味服之自愈一本臟有熱而發燒熱者面色紅燥口中作渴鼻門乾燥或大便祕結治宜瀉白散心經燒熱有二一面紅狂躁唇舌色紅紫口氣莽莽小便赤治用黃連生地木通甘草竹葉一舌白口氣微小便清驚悸燒熱微微此虛燒也治用茯神遠志甘草脾家燒熱有三一實熱舌唇牙床皆紅燥或破裂或碎爛或大便祕結或瀉黃或口渴氣莽治用石膏一錢灶心土三錢黃芩甘草一虛寒脾本無寒虛則生寒面生慘淡唇口淡白微渴口氣微微帶溫冷燒熱勢微治用六君子湯氣虛即脾虛治法同一實痰燒熱脾本有痰因濕而動或兼食傷面色黯晦唇有晦色喉內痰勢響滑治宜六君子湯加藿香肝經燒熱有一一肝經燒熱面色青目直視或驚或轉筋或兩手尋衣捻物或多怒治用瀉肝湯或天保采薇湯時毒燒熱有一一時毒燒熱或腫頸或腫腮或身有腫毒或頭瘡搽藥瘡愈毒氣歸內氣喘治用天保采薇湯托解瘡復出仍用天保采薇湯一二劑自愈血虛燒熱有一一血虛燒熱面無血氣下午至夜燒熱加重唇口白淡大便常滯而不出出則溏瀉治用四物湯余會試都門有粵東臬司張玉川乃嬡年十三歲身極瘦弱每食只能一茶鍾許終日微微燒熱下午加甚都中醫俱作童癆治不效延餘一望知為血虛血虛必腸胃無滋以致窄狹故不能多食用四物湯加厚朴橘紅服十劑兼用熟大麥米為飯半月愈此望色審竅而知血虛燒熱之一驗也
